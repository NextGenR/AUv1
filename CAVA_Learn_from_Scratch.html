}, {"k": "tf", "q": "Lateral entry of domain experts into central government ministries is permanently prohibited by the Constitution of India.", "a": 1, "e": "False. Lateral entry has historical precedent (Montek Singh Ahluwalia, Manmohan Singh, Nandan Nilekani) and is permissible if institutionalized transparently."}]}, {"n": "The 4-Pillar Way Forward & The 'Bamboo Frame'", "e": "🎋", "d": "Mission Karmayogi FRAC, Desk Officer de-layering, Generalist-Plus & the Bamboo Frame", "section": "Way Forward", "c": [{"t": "Way Forward: Mission Karmayogi & 3-Tier Desk Officer System", "pts": [{"kw": "Rule-Based to Role-Based HR", "ex": "Over 40 lakh civil servants undergoing competency-mapped training on the iGOT Karmayogi digital platform.", "desc": "Mission Karmayogi's Framework of Roles, Activities, and Competencies (FRAC) matches officers to posts based on demonstrated competencies rather than seniority alone."}, {"kw": "Desk Officer System (Max 3 Tiers)", "ex": "Central Secretariat Desk Officer System eliminating 4 layers of file transit.", "desc": "Caps file noting to a maximum of 3 tiers (Desk Officer → Joint Sec → Sec), eliminating sluggish multi-layer paper trails."}], "b": ["<b>Rule-Based to Role-Based HR:</b> Mission Karmayogi FRAC competency mapping.<br><small>⚡ <i>Example: Over 40 lakh civil servants trained on iGOT platform.</i></small>", "<b>Desk Officer System:</b> Caps file noting to a maximum of 3 tiers.<br><small>⚡ <i>Example: Eliminates 4 layers of file transit in Central Secretariat.</i></small>"], "k": ["Mission Karmayogi", "FRAC Framework", "iGOT Platform", "Desk Officer System", "3-Tier De-layering"]}, {"t": "Way Forward: The 'Generalist-Plus' Model & The 'Bamboo Frame'", "pts": [{"kw": "The 'Generalist-Plus' Model", "ex": "10–12 years of foundational grassroots district immersion (SDM/DM) followed by mandatory specialization in 2–3 core domain clusters.", "desc": "Preserves the irreplaceable grassroots field reality while building technical depth at the policy apex."}, {"kw": "Steel Frame to Bamboo Frame Metaphor", "ex": "Ready-to-use conclusion for 2016 Q14 and 2026 Q8.", "desc": "“Contemporary governance does not require choosing between the generalist and the specialist in a zero-sum binary; rather, it demands evolving from a colonial 'Steel Frame' into a collaborative 'Bamboo Frame'—flexible, specialized at the apex, yet deeply rooted in grassroots realities—to achieve Viksit Bharat by 2047.”"}], "b": ["<b>The 'Generalist-Plus' Model:</b> 10–12 years district field immersion followed by mandatory domain specialization.<br><small>⚡ <i>Example: Ground-truth district empathy combined with apex domain mastery.</i></small>", "<b>Steel Frame to Bamboo Frame:</b> Flexible, specialized at apex, deeply rooted in grassroots.<br><small>⚡ <i>Example: Ready-to-use conclusion for 2016 Q14 and 2026 Q8.</i></small>"], "k": ["Generalist-Plus Model", "SAG/HAG Open Merit", "Bamboo Frame", "Viksit Bharat 2047"]}], "q": [{"k": "mc", "q": "What is the core structural objective of the 'Generalist-Plus' model recommended for Indian civil services?", "o": ["Abolishing grassroots field postings for young officers", "Combining 10-12 years of district field immersion with mandatory mid-career domain specialization", "Replacing all civil servants with private management consultants", "Eliminating the UPSC civil services examination"], "a": 1, "e": "Generalist-Plus preserves the irreplaceable grassroots district foundation while institutionalizing apex domain specialization."}, {"k": "sort", "q": "Sort the administrative attributes: Colonial 'Steel Frame' vs Viksit Bharat 'Bamboo Frame'.", "b": ["Colonial Steel Frame", "Viksit Bharat Bamboo Frame"], "it": [["Rigid, Process-Bound & Risk-Averse", 0], ["Paternalistic 'Mai-Baap' Citizen Supplicant Model", 0], ["Flexible, Resilient & Deeply Anchored in Grassroots", 1], ["Competency-Mapped Role-Based HR under FRAC", 1]]}, {"k": "match", "q": "Match the reform pillar to its administrative mechanism.", "p": [["Competency HR", "Mission Karmayogi FRAC Architecture"], ["Administrative De-layering", "Desk Officer System (Max 3 Tiers)"], ["Apex Meritocracy", "Open SAG/HAG Posts Across Cadres"]]}, {"k": "flag", "q": "Tap the red flag: the one proposal that would damage democratic governance.", "o": ["Transitioning from rule-based to role-based competency under Mission Karmayogi,", "mandating 3-tier file processing under the Desk Officer system,", "and completely abolishing grassroots district postings to keep officers in Delhi secretariats for life."], "a": 2, "e": "Red Flag: Abolishing grassroots district postings would destroy the ground-truth empathy that makes Indian administration responsive."}]}], "pyq": [{"k": "flip", "q": "UPSC Mains 2016 (GS-2, Q14 | 12.5 Marks | 200 Words): 'Traditional bureaucratic structure and culture have hampered the process of socio-economic development in India.' Comment.", "r": "<b>Demand Analysis:</b> Objective evaluation ('Comment') of both structural and cultural dimensions, balanced with the counter-view (Patel's Steel Frame) and modern reforms.<br><br><b>1. Structural Pathologies:</b><br>• <i>Multi-Tier Hierarchy:</i> 6–8 levels of file noting in Central Secretariat causes 22+ days transit delay for routine clearances.<br>• <i>Departmental Silos:</i> Water governance split across 4 ministries; road paving dug up repeatedly by telecom/gas utilities.<br>• <i>Secretariat Monopoly:</i> Starvation of PRIs/ULBs of 3Fs (Functions, Funds, Functionaries) despite 73rd/74th Amendments.<br><br><b>2. Cultural Pathologies:</b><br>• <i>Red-Tapism:</i> Process compliance prioritized over developmental outcomes.<br>• <i>'Mai-Baap' Paternalism:</i> Citizens treated as supplicants rather than rights-holders.<br>• <i>3Cs Syndrome:</i> Dread of retrospective CBI/CVC/CAG audits causes defensive administration and ₹3 Lakh Cr capex cost overruns (MOSPI data).<br><br><b>3. The Counter-Perspective:</b> Sardar Patel's 'Steel Frame' preserved territorial integrity, managed massive natural disasters (Remal, COVID), and provided constitutional continuity.<br><br><b>4. Way Forward:</b> Transition from 'Steel Frame' to 'Bamboo Frame' via Mission Karmayogi (FRAC role-based HR) and Desk Officer 3-tier de-layering."}, {"k": "flip", "q": "UPSC Mains 2026 (GS-2, Q8 | 10 Marks | 150 Words): Analyse the advantages and limitations of the generalist structure of the Indian Civil Services in contemporary governance.", "r": "<b>Demand Analysis:</b> Dissect ('Analyse') the 1854 Macaulay/Northcote-Trevelyan generalist architecture into 5 enduring virtues vs 4 modern limitations.<br><br><b>1. 5 Enduring Virtues:</b><br>• <i>Grassroots Field Reality:</i> SDM/Collector tenures ground central policies in village-level realities.<br>• <i>Holistic Inter-Departmental Synthesizer:</i> Prevents technical 'tunnel vision'; balances competing sectoral budgets.<br>• <i>Crisis Leadership:</i> Unified command of police, doctors, and logistics during disasters/pandemics.<br>• <i>Federal Glue:</i> All-India Services (Article 312) bind Centre and States.<br>• <i>Constitutional Anonymity:</i> Impartial buffer during democratic regime transitions.<br><br><b>2. 4 Modern Limitations:</b><br>• <i>Domain Asymmetry:</i> Fulton Committee (1968) critique of the 'Cult of the Amateur' in high-tech policy (AI, green hydrogen, WTO).<br>• <i>18-Month Musical Chairs:</i> Rapid transfers destroy institutional memory.<br>• <i>Consultant Capture:</i> Inability to analyze technical data causes total reliance on Big Four private consultants.<br>• <i>Specialist Demoralization:</i> IAS apex monopoly creates a glass ceiling for IRS, scientists, and engineers.<br><br><b>3. Way Forward:</b> Implement the 'Generalist-Plus' model (2nd ARC 13-year specialization rule) and institutionalize transparent lateral entry under Article 16(4)."}], "sks": [{"t": "2016 Q14: Bureaucratic Structure & Culture vs Development", "s": ["Colonial Genesis: Macaulay (1854) & Weberian legal-rationalism designed for imperial control, not welfare delivery.", "Structural Pathologies: 6-8 tier file noting ladder, departmental silos (water split), starved 3Fs at PRIs.", "Cultural Pathologies: Red-tapism, 'Mai-Baap' paternalism, and 3Cs fear causing defensive administration.", "Developmental Toll: Stalled capex projects, massive MOSPI cost overruns, and compromised welfare delivery.", "The Bamboo Frame: Mission Karmayogi (FRAC competency), Desk Officer 3-tier system, and 2nd ARC flatter agencies."]}, {"t": "2026 Q8: Generalist Structure — Advantages vs Limitations", "s": ["Context: Macaulay & Northcote-Trevelyan (1854) premise that liberal arts produces versatile all-rounders.", "5 Virtues: Grassroots DM exposure, holistic synthesis, crisis command, federal glue, and constitutional neutrality.", "4 Limitations: Technical asymmetry, Fulton's 'Cult of the Amateur', 18-month musical chairs, and Big 4 dependency.", "High-Yield Committees: 1st ARC (8 functional areas), Surinder Nath (11 clusters), 2nd ARC (13-year rule).", "Conclusion: Evolve to the 'Generalist-Plus' Bamboo Frame: strong grassroots roots with flexible specialized apex."]}, {"t": "Administrative Reform Roadmap (Committees to Bamboo Frame)", "s": ["Early Reforms: Fulton Committee 1968 ('Cult of Amateur') & 1st ARC 1966 (8 Functional Areas).", "Modern Blueprints: Surinder Nath 2003 (11 Domain Clusters) & 2nd ARC 10th Report (13-Year Specialization Rule).", "Pioneers & Synergy: Kurien, Swaminathan, Sreedharan, Nilekani, and Aspirational Districts Programme (ADP).", "Contemporary Safeguards: Institutionalize lateral entry with strict Article 16(4) constitutional reservations.", "Viksit Bharat 2047: Rule-to-Role under Mission Karmayogi and de-layering via Desk Officer 3-tier processing."]}], "bg": {"core": "Colonial Macaulay & Weberian legal-rational framework designed for revenue extraction and order maintenance; requires structural evolution into a specialized, role-based Bamboo Frame.", "data": "Files traverse 6-8 tiers taking 22+ days; average senior tenure 18 months; MOSPI tracks ₹3 Lakh Cr+ delays due to defensive administration."}, "aq": [{"q": "Which 1854 report established open meritocratic competition for the Indian Civil Service?", "o": ["Macaulay Report", "Fulton Report", "Surinder Nath Report", "Aitchison Report"], "a": 0}, {"q": "Which committee coined the phrase 'Cult of the Amateur' regarding generalist civil services?", "o": ["1st ARC", "Fulton Committee (1968)", "2nd ARC", "Sarkaria Commission"], "a": 1}, {"q": "How many domain clusters were recommended by the Surinder Nath Committee (2003)?", "o": ["4 Clusters", "8 Clusters", "11 Clusters", "15 Clusters"], "a": 2}, {"q": "What mandatory service period did 2nd ARC (10th Report) propose before domain specialization?", "o": ["5 Years", "8 Years", "13 Years", "20 Years"], "a": 2}, {"q": "What is the core HR transformation under Mission Karmayogi?", "o": ["Rule-based to Role-based (FRAC)", "Seniority-only promotions", "Total privatization", "Abolition of UPSC"], "a": 0}], "dq": [{"q": "Mystery of the ₹2,500 Crore Stalled Highway: Multiple utility clearances delayed by 3 years. What structural pathology is responsible?", "o": ["Departmental Silos & Multi-Tier Hierarchy", "Panchayati Raj Over-Empowerment", "Excessive Lateral Entry", "Constitutional Anonymity"], "a": 0, "e": "Siloed ministries with zero data sharing (prior to PM Gati-Shakti) caused repeated road excavations and multi-year delays."}, {"q": "Mystery of the Passive Joint Secretary: An officer refuses to sign off on a crucial medical equipment tender despite clear budget sanction. Why?", "o": ["Lack of internet connectivity", "3Cs Fear (CBI, CVC, CAG) causing defensive risk aversion", "Awaiting Fulton Committee clearance", "Strict adherence to Sevottam"], "a": 1, "e": "Fear of retrospective vigilance inquiries under the 3Cs causes defensive administration and paralysis in procurement."}, {"q": "Mystery of the Sudden Space Tech Policy: A ministry issues a flawed satellite tender written by a private Big Four consulting firm. What is the root cause?", "o": ["Domain asymmetry and 18-month transfers leading to consultant capture", "Excessive scientific staffing in the civil service", "The Desk Officer system", "Patel's Steel Frame"], "a": 0, "e": "Lack of internal technical depth and frequent rotations cause ministries to become captured by external consulting firms."}], "sq": {"title": "District Magistrate Crisis: Flood, Silos & Digital Reform", "intro": "You are the newly posted District Magistrate of a flood-prone district facing severe administrative inertia.", "steps": [{"p": "A major river breach threatens 40 villages. The Irrigation, Police, and Health departments are arguing over jurisdictions.", "c": [{"t": "Assume unified multi-departmental emergency command under Disaster Management Act", "e": "Correct! Generalist leadership unifies disparate line departments into rapid crisis command.", "ok": 1}, {"t": "Wait for files to be routed to State Secretariat for formal inter-departmental approval", "e": "Fatal delay! Hierarchical paper transit will drown the villages.", "ok": 0}]}, {"p": "Post-relief, you find the local hospital ran out of antivenom because the procurement file spent 30 days passing through 6 noting layers.", "c": [{"t": "Implement the Desk Officer 3-tier processing system for critical drug approvals", "e": "Superb! De-layering eliminates administrative bottlenecks and ensures timely delivery.", "ok": 1}, {"t": "Add two more inspection officers to the file transit chain", "e": "Adding more layers worsens the hierarchy flaw and delays emergency supplies.", "ok": 0}]}]}, "vq": {"title": "Mains Answer Architect: The 'Bamboo Frame' Synthesis", "cards": [{"t": "Hook", "p": "Open with Macaulay (1854) and Patel's Steel Frame (Article 311) uniting a nascent republic."}, {"t": "Pathology", "p": "Examine the dual bottleneck: structural hierarchy/silos and cultural 3Cs risk aversion."}, {"t": "Synthesis", "p": "Quote Fulton ('Cult of the Amateur') and 2nd ARC (13-year rule); showcase ADP synergy."}, {"t": "Climax", "p": "Conclude with the 'Bamboo Frame': flexible, resilient, specialized apex rooted in grassroots truth for Viksit Bharat 2047."}]}, "bq": [{"n": "The Status-Quoist Syndicate Overlord", "hp": 1000, "q": "The Overlord summons 'Multi-Tier Red-Tape Armor'! How do you dismantle the 6-8 file noting levels?", "o": ["Desk Officer 3-Tier De-layering System", "Mandatory 10-Tier Verification Chain", "Abolish All Digital Notings", "Annual Confidential Report Secrecy"], "a": 0, "d": 350}, {"n": "The Status-Quoist Syndicate Overlord", "hp": 650, "q": "The Overlord casts 'The 3Cs Panic Hex', freezing all commercial decisions! What is your counter-spell?", "o": ["Section 17A Prior Sanction Protection for Bona Fide Decisions", "Retrospective CBI Inquiries Without Evidence", "Complete Avoidance of Public Procurement", "Transferring Files to Other Ministries"], "a": 0, "d": 350}, {"n": "The Status-Quoist Syndicate Overlord", "hp": 300, "q": "The Overlord unleashes 'The Inflexible Steel Frame Strike'! Deliver the decisive final blow for Viksit Bharat 2047:", "o": ["Transition to the Resilient, Role-Based 'Bamboo Frame' under Mission Karmayogi", "Reinstate 1854 East India Company Patronage", "Mandate 6-Month Rotations Across Unrelated Sectors", "Ban Technical Specialists from All Secretariat Roles"], "a": 0, "d": 350}]}};

function dropBlock(binIdx){
  clearInterval(BLK.timer);
  BLK.paused = true;
  var item = BLK.deck[BLK.idx];
  var correctIdx = item[1];
  var isOk = binIdx === correctIdx;

  if (isOk) {
    BLK.counts[binIdx] = (BLK.counts[binIdx] || 0) + 1;
    var gain = 10 * BLK.combo;
    BLK.score += gain;
    BLK.combo++;
    if (BLK.combo > BLK.maxCombo) BLK.maxCombo = BLK.combo;
    beep(true);
    var card = document.getElementById('b-card');
    if (card) card.classList.add('catch');
    var btn = app.querySelector('[data-b="' + binIdx + '"]');
    if (btn) btn.classList.add('b-ok');
    var fb = '<div class="blk-toast ok"><b>✓ Correct! +' + gain + ' XP</b> (🔥 x' + BLK.combo + ' combo)<br><small>' + esc(item[2]) + '</small></div>';
    setTimeout(function(){
      BLK.idx++;
      blkStep();
    }, 850);
  } else {
    BLK.hearts--;
    BLK.mistakes++;
    BLK.combo = 1;
    beep(false);
    var btnBad = app.querySelector('[data-b="' + binIdx + '"]');
    if (btnBad) btnBad.classList.add('b-no');
    var btnCorrect = app.querySelector('[data-b="' + correctIdx + '"]');
    if (btnCorrect) btnCorrect.classList.add('b-ok');
    var reason = binIdx === -1 ? '⏱ Out of time!' : '✕ Not quite!';
    var fb = '<div class="blk-toast no"><b>' + reason + '</b><br>Belongs in <b>' + esc(BLK.buckets[correctIdx]) + '</b>.<br><small>' + esc(item[2]) + '</small></div>' +
      '<button class="btn" id="b-next" style="margin-top:10px;padding:8px 16px;font-size:15px">Next Term →</button>';
    blkDraw(fb);
    var nxt = document.getElementById('b-next');
    if (nxt) nxt.onclick = function(){
      BLK.idx++;
      blkStep();
    };
  }
}

function blkEnd(){
  clearInterval(BLK.timer);
  var win = BLK.hearts > 0;
  var total = BLK.deck.length;
  var solved = total - BLK.mistakes;
  var pct = Math.max(0, Math.round(solved / total * 100));
  addXp(BLK.score);

  var h = '<div class="end">' +
    '<div class="big">' + (win ? '🧱' : '💔') + '</div>' +
    '<h1>' + (win ? 'Block Drop Cleared!' : 'Out of Hearts') + '</h1>' +
    '<p class="sub">' + (win ? 'Mastered key terms and conceptual classifications.' : 'Keep drilling to lock in your term reflexes.') + '</p>' +
    '<div class="stats">' +
      '<div class="stat">+' + BLK.score + '<small>XP Earned</small></div>' +
      '<div class="stat">' + pct + '%<small>Accuracy</small></div>' +
      '<div class="stat">🔥 x' + BLK.maxCombo + '<small>Max Combo</small></div>' +
    '</div>' +
    '<button class="btn" id="b-again">Play Again</button>' +
    '<button class="btn" id="b-hub" style="margin-top:10px;background:var(--card);color:var(--ink);border-color:var(--line)">Back to Game Hub</button>' +
  '</div>';

  app.innerHTML = h;
  document.getElementById('b-again').onclick = startBlocks;
  document.getElementById('b-hub').onclick = hub;
  if (win && pct >= 70) confetti();
}

function startDaily(){
  var s = 0, d = today();
  for(var i = 0; i < d.length; i++) s = (s * 31 + d.charCodeAt(i)) % 2147483647;
  var p = [];
  var top = DATA[CUR_TOPIC];
  top.lessons.forEach(function(l){
    l.q.forEach(function(q){
      if(['mc', 'tf', 'multi', 'flag', 'year'].indexOf(q.k) > -1) p.push(q);
    });
  });
  var out = [];
  while(out.length < 5 && p.length){
    s = (s * 48271) % 2147483647;
    out.push(p.splice(s % p.length, 1)[0]);
  }
  go(out, { daily: 1 });
}

function ltTimer(){
  clearInterval(IV);
  var s = 10;
  function t(){
    var k = document.querySelector('.kind');
    if(!k || R.ok !== null){ clearInterval(IV); return; }
    k.textContent = '⚡ Lightning · ' + s + 's';
    if(s-- <= 0){
      clearInterval(IV);
      R.ok = false;
      R.sel = [];
      R.msg = 'Too slow! ' + (R.q.e || '');
      finish();
    }
  }
  t();
  IV = setInterval(t, 1000);
}

function sh(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function tx(x,y,t,fs,f){
  var l = t.split('|');
  return `<text x='${x}' text-anchor='middle' font-size='${fs||13}' font-weight='700' fill='${f||'var(--ink)'}'>` +
    l.map(function(s,i){ return `<tspan x='${x}' y='${y + i*15 - (l.length-1)*7}'>${s}</tspan>`; }).join('') + '</text>';
}
function bx(x,y,w,h,t,f){
  return `<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='10' fill='${f||'var(--card)'}' stroke='var(--h)' stroke-width='2'/>` +
    tx(x+w/2, y+h/2+5, t, 12, f ? '#fff' : 0);
}
function ar(a,b,c,d){
  return `<line x1='${a}' y1='${b}' x2='${c}' y2='${d}' stroke='var(--h)' stroke-width='2.5' marker-end='url(#ar)'/>`;
}

function start(i){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[i];
  var isPractice = (CUR_TOPIC === 'msme' || !!l.practice_first);
  R = {
    i: i,
    ci: isPractice ? (l.c ? l.c.length : 0) : 0,
    isPractice: isPractice,
    queue: l.q.map(function(q, n){ return { q: q, key: CUR_TOPIC + ':' + i + ':' + n }; }),
    total: isPractice ? l.q.length : (l.c.length + l.q.length),
    solved: 0,
    hearts: isPractice ? 999 : 5,
    mist: 0,
    xp: 0
  };
  next();
}

function next(){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  if(!R.isPractice && l && R.ci < l.c.length) return card();
  if(!R.isPractice && R.hearts <= 0) return fin(false);
  if(!R.queue.length) return fin(true);
  R.cur = R.queue.shift();
  clearInterval(IV);
  R.sel = [];
  R.ok = null;
  R.q = R.cur.q;
  var q = R.q;
  if(q.o) R.ord = sh(q.o.map(function(_, i){ return i; }));
  if(q.k === "tf") R.ord = [0, 1];
  if(q.k === "match"){
    R.L = sh(q.p.map(function(_, i){ return i; }));
    R.Rr = sh(q.p.map(function(_, i){ return i; }));
    R.m = [];
    R.pick = null;
    R.err = false;
  }
  if(q.k === "flip") R.rev = false;
  if(q.k === "flag") R.ord = q.o.map(function(_, i){ return i; });
  if(q.k === "sort"){ R.si = 0; R.err = false; R.it = sh(q.it); }
  if(q.k === "story"){ R.so = 0; R.pk = null; R.err = false; }
  if(q.k === "riddle") R.cl = 1;
  if(q.k === "year") R.sel = [Math.round((q.min + q.max) / 2)];
  draw();
}

function head(){
  var rightIndicator;
  if (R.isPractice) {
    rightIndicator = '<span class="practice-pill">🎯 Practice ' + Math.min(R.solved + 1, R.total) + '/' + R.total + '</span>';
  } else if (R.pyq) {
    rightIndicator = '';
  } else {
    rightIndicator = '<span class="hearts">❤ ' + R.hearts + '</span>';
  }
  return '<div class="qhead">' +
    '<button class="x" id="quit" aria-label="Quit lesson">✕</button>' +
    '<div class="bar"><i style="width:' + Math.round(R.solved/R.total*100) + '%"></i></div>' +
    rightIndicator +
  '</div>';
}

  document.getElementById("quit").onclick = function(){
    if(confirm("Quit this lesson? Progress will be lost.")) {
      clearInterval(IV);
      home();
    }
  };
}

function card(){ R.sh = 1; cardDraw(); }


function toggleSRDetail(idx){
  var el = document.getElementById('sr-det-' + idx);
  var arr = document.getElementById('sr-arr-' + idx);
  if (el) {
    if (el.style.display === 'none' || !el.style.display) {
      el.style.display = 'block';
      if (arr) arr.textContent = ' ▴ (Tap to collapse)';
    } else {
      el.style.display = 'none';
      if (arr) arr.textContent = ' ▾ (Tap to read write-up)';
    }
  }
}

function cardDraw(){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  var c = l.c[R.ci];
  var tot = l.c.length;
  var hue = top.hue[R.i % top.hue.length];
  var ico = top.ico[R.i % top.ico.length][R.ci % 3] || l.e;
  var diagramHtml = diag(CUR_TOPIC, R.i, R.ci);

  // === DEDICATED SR TAB / CS_STRUCTURE MINIMALIST ARCHITECTURE ===
  if (CUR_TOPIC === 'cs_structure') {
    var secName = l.section || (R.i === 0 ? 'Introduction' : (R.i <= 2 ? 'Background' : (R.i <= 4 ? 'Challenges' : (R.i === 5 ? 'Solutions' : (R.i === 6 ? 'Challenges' : (R.i <= 8 ? 'Committees' : (R.i === 9 ? 'Case Studies' : 'Way Forward')))))));
    var h = head() + '<div class="body" style="--h:' + hue + '">';

    // Clean Minimalist Heading (No colorful icon top bar)
    h += '<div class="sr-card-head">' +
      '<div class="sr-badge-tag">' + esc(secName) + '</div>' +
      '<div class="sr-counter">Page ' + (R.ci + 1) + ' of ' + tot + '</div>' +
      '<h2 class="sr-card-title">' + esc(c.t) + '</h2>' +
    '</div>';

    // Step 1: Special Question Demand Formatting
    if (c.isQuestionDemand && c.pyqText) {
      h += '<div class="sr-pyq-box">' +
        '<div class="sr-pyq-year">' + esc(c.pyqYear) + '</div>' +
        '<div class="sr-pyq-text">' + esc(c.pyqText) + '</div>' +
      '</div>';
      h += '<div class="sr-demand-label">🎯 DEMAND OF THE QUESTION:</div>';
    }

    // Points Rendering (Keywords-First with Visible Recent Examples & Tap-to-Reveal Write-Ups)
    if (c.pts && c.pts.length) {
      for (var p = 0; p < c.pts.length; p++) {
        var pt = c.pts[p];
        h += '<div class="sr-point-box">' +
          '<button class="sr-kw-btn" type="button" onclick="toggleSRDetail(' + p + ')">' +
            '<span class="sr-kw-tag">🔑 ' + esc(pt.kw) + '</span>' +
            '<span class="sr-kw-toggle" id="sr-arr-' + p + '"> ▾ (Tap to read write-up)</span>' +
          '</button>' +
          '<div class="sr-visible-example">' +
            '<span class="sr-ex-badge">⚡ Example</span>' +
            '<div class="sr-ex-text">' + pt.ex + '</div>' +
          '</div>' +
          '<div class="sr-hidden-detail" id="sr-det-' + p + '" style="display:none">' +
            '<div class="sr-desc-text">' + pt.desc + '</div>' +
          '</div>' +
        '</div>';
      }
    } else if (c.b && c.b.length) {
      for (var i = 0; i < c.b.length; i++) {
        h += '<div class="tile"><span class="dot">✦</span><p>' + c.b[i] + '</p></div>';
      }
    }

    // Diagram (rendered below points)
    if (diagramHtml) {
      h += '<div class="sr-diag-box">' + diagramHtml + '</div>';
    }

    // Button Label
    var btnText = 'Got it · Next Card →';
    if (R.i === 0) {
      if (R.ci === 0) btnText = 'Continue to Question 2 →';
      else if (R.ci === 1) btnText = 'Continue to Thematic Synthesis →';
      else btnText = 'Start Learning Chapter →';
    } else if (R.ci === tot - 1) {
      btnText = (l.q && l.q.length) ? 'Got it · Start Questions →' : 'Complete Step →';
    }

    h += '</div><div class="foot"><button class="btn" id="go">' + btnText + '</button></div>';
    app.innerHTML = h;
    quit();

    document.getElementById("go").onclick = function(){
      R.solved++;
      R.ci++;
      next();
    };
    return;
  }

  // === STANDARD CAVA LEARNING ENGINE FOR ALL OTHER TOPICS (100% INTACT) ===
  var n = c.b.length;
  var hasDiag = !!diagramHtml;
  var hasKw = !!(c.k && c.k.length);
  var hasOwl = !!c.n;

  var extraSteps = [];
  if (hasDiag) extraSteps.push('diag');
  if (hasKw) extraSteps.push('kw');
  if (hasOwl) extraSteps.push('owl');

  var maxStage = extraSteps.length;
  var totalCardSteps = n + maxStage;
  var currentStep = R.sh;

  var h = head() + '<div class="body" style="--h:' + hue + '">' +
    '<div class="hero"><span class="ico">' + ico + '</span><div><small>' + esc(l.n) + ' · card ' + (R.ci+1) + ' of ' + tot + '</small><h2>' + esc(c.t) + '</h2></div></div>';

  // 1. Show bullet points up to currentStep (capped at n)
  var bulletsToShow = Math.min(currentStep, n);
  for(var i = 0; i < bulletsToShow; i++){
    h += '<div class="tile' + (i === bulletsToShow - 1 && i > 0 ? ' pop' : '') + '"><span class="dot">✦</span><p>' + c.b[i] + '</p></div>';
  }

  // 2. Reveal post-bullet items sequentially ONLY when currentStep advances past n
  var postStep = currentStep - n;
  if (postStep > 0) {
    for (var s = 0; s < postStep && s < extraSteps.length; s++) {
      var stepType = extraSteps[s];
      var isLatest = (s === postStep - 1);
      if (stepType === 'diag') {
        h += '<div class="' + (isLatest ? 'pop' : '') + '">' + diagramHtml + '</div>';
      } else if (stepType === 'kw') {
        unlock(c);
        h += '<p class="kw' + (isLatest ? ' pop' : '') + '">🔑 Keywords unlocked</p><div class="chips' + (isLatest ? ' pop' : '') + '">';
        c.k.forEach(function(k){ h += '<span class="chip">' + esc(k) + '</span>'; });
        h += '</div>';
      } else if (stepType === 'owl') {
        h += '<div class="bub' + (isLatest ? ' pop' : '') + '"><span>🦉</span><p>' + esc(c.n) + '</p></div>';
      }
    }
  }

  // 3. Button label
  var isFinal = (currentStep >= totalCardSteps);
  var btnText = 'Continue';
  if (currentStep < n) {
    btnText = 'Continue (' + currentStep + '/' + n + ')';
  } else if (isFinal) {
    btnText = (R.ci === tot - 1) ? 'Got it · Start Questions →' : 'Got it · Next Card →';
  } else {
    var nextStepType = extraSteps[postStep];
    if (nextStepType === 'diag') btnText = 'Continue → Picture it';
    else if (nextStepType === 'kw') btnText = 'Continue → Keywords';
    else if (nextStepType === 'owl') btnText = 'Continue → Note';
    else btnText = 'Continue';
  }

  h += '</div><div class="foot"><button class="btn" id="go">' + btnText + '</button></div>';
  app.innerHTML = h;
  quit();

  document.getElementById("go").onclick = function(){
    if (!isFinal) {
      R.sh++;
      cardDraw();
      var b = document.querySelector(".body");
      if (b) {
        setTimeout(function(){
          b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' });
        }, 40);
      }
    } else {
      R.solved++;
      R.ci++;
      next();
    }
  };
}

var KIND = {
  riddle: "Detective: who am I?",
  story: "Officer mission",
  flag: "Spot the red flag",
  year: "Slide to the year",
  sort: "Sort the cards",
  tf: "True or false",
  mc: "Pick one",
  multi: "Select all that apply",
  order: "Put in order",
  match: "Match the pairs",
  flip: "Flip the card"
};

function draw(){
  var q = R.q;
  app.innerHTML = head() + '<div class="body"><p class="kind">' + (KIND[q.k] || '') + '</p><p class="q">' + esc(q.q) + '</p><div id="in"></div></div><div class="foot" id="foot"></div>';
  quit();
  inner();
  foot();
  if(R.lt) ltTimer();
}

function inner(){
  var q = R.q, el = document.getElementById("in"), h = "";
  if(q.k === "mc" || q.k === "riddle" || q.k === "flag" || q.k === "tf" || q.k === "multi"){
    var lab = q.k === "tf" ? ["True", "False"] : q.o;
    if(q.k === "riddle"){
      h = '<div class="fact">';
      for(var c = 0; c < R.cl; c++) h += '<p>🔎 ' + esc(q.c[c]) + '</p>';
      h += '</div>';
      if(R.cl < q.c.length && R.ok === null) {
        h += '<button class="mb" id="nc" style="width:100%;margin-bottom:12px">💡 Next clue (−3 XP)</button>';
      }
    }
    R.ord.forEach(function(i){
      var isSel = R.sel.indexOf(i) > -1;
      var isCorrect = (q.k === "multi" ? (q.a && q.a.indexOf(i) > -1) : (i === q.a));
      var cls = 'opt' + (q.k === "flag" ? ' fl' : '') + (isSel ? ' sel' : '');
      if(R.ok !== null){
        if(isCorrect) cls += ' good';
        else if(isSel) cls += ' bad';
      }
      h += '<button class="' + cls + '" data-i="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(lab[i]) + '</button>';
    });
    el.innerHTML = h;
    var nc = document.getElementById("nc");
    if(nc) nc.onclick = function(){ R.cl++; R.xp = Math.max(0, R.xp - 3); inner(); };
    el.querySelectorAll(".opt").forEach(function(b){
      b.onclick = function(){
        var i = +b.dataset.i;
        if(q.k === "multi"){
          var p = R.sel.indexOf(i);
          p > -1 ? R.sel.splice(p, 1) : R.sel.push(i);
        } else {
          R.sel = [i];
        }
        inner(); foot();
        if(R.lt && q.k !== "multi"){
          clearInterval(IV);
          R.ok = R.sel[0] === q.a;
          R.msg = undefined;
          finish();
        }
      };
    });
  } else if(q.k === "order"){
    h = '<div class="slots' + (q.inl ? ' w' : '') + '">' + (R.sel.length ? '' : '<span class="ph">Tap the items below in order</span>');
    R.sel.forEach(function(i){
      h += '<button class="opt' + (q.inl ? ' fl' : '') + '" data-r="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(q.o[i]) + '</button>';
    });
    h += '</div>';
    R.ord.forEach(function(i){
      if(R.sel.indexOf(i) < 0) h += '<button class="opt' + (q.inl ? ' fl' : '') + '" data-a="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(q.o[i]) + '</button>';
    });
    el.innerHTML = h;
    el.querySelectorAll("[data-a]").forEach(function(b){
      b.onclick = function(){ R.sel.push(+b.dataset.a); inner(); foot(); };
    });
    el.querySelectorAll("[data-r]").forEach(function(b){
      b.onclick = function(){ R.sel.splice(R.sel.indexOf(+b.dataset.r), 1); inner(); foot(); };
    });
  } else if(q.k === "match"){
    h = '<div class="cols"><div>';
    R.L.forEach(function(i){
      h += '<button class="opt' + (R.pick === i ? ' sel' : '') + (R.m.indexOf(i) > -1 ? ' gone' : '') + '" data-l="' + i + '">' + esc(q.p[i][0]) + '</button>';
    });
    h += '</div><div>';
    R.Rr.forEach(function(i){
      h += '<button class="opt' + (R.m.indexOf(i) > -1 ? ' gone' : '') + '" data-r="' + i + '">' + esc(q.p[i][1]) + '</button>';
    });
    el.innerHTML = h + '</div></div>';
    el.querySelectorAll("[data-l]").forEach(function(b){
      b.onclick = function(){ R.pick = +b.dataset.l; inner(); };
    });
    el.querySelectorAll("[data-r]").forEach(function(b){
      b.onclick = function(){
        if(R.pick === null) return;
        if(R.pick === +b.dataset.r){
          R.m.push(R.pick);
          R.pick = null;
          if(R.m.length === q.p.length){
            R.ok = !R.err;
            finish();
            return;
          }
          inner();
        } else {
          R.err = true;
          R.pick = null;
          inner();
          var bb = el.querySelector('[data-r="' + b.dataset.r + '"]');
          if(bb) bb.classList.add("bad");
        }
      };
    });
  } else if(q.k === "year"){
    var yv = R.sel.length ? R.sel[0] : Math.round((q.min + q.max) / 2);
    el.innerHTML = '<div class="skn" id="yv">' + (R.sel.length ? yv : '?') + '</div><input type="range" id="yr" min="' + q.min + '" max="' + q.max + '" value="' + yv + '" style="width:100%" aria-label="Year"' + (R.ok !== null ? ' disabled' : '') + '>';
    var yr = document.getElementById('yr');
    yr.onchange = yr.oninput = function(){
      R.sel = [+yr.value];
      document.getElementById('yv').textContent = yr.value;
      foot();
    };
  } else if(q.k === "sort"){
    var it = R.it[R.si];
    if(!it){ el.innerHTML = '<p class="sub" style="text-align:center">All sorted!</p>'; return; }
    h = '<p class="ph" style="text-align:center">' + (R.si + 1) + ' of ' + R.it.length + '</p><div class="flip" style="text-align:center;font-weight:800;font-size:22px;display:grid;place-items:center;cursor:default">' + esc(it[0]) + '</div><div class="cols" style="margin-top:16px">';
    q.b.forEach(function(b, j){
      h += '<button class="opt" style="text-align:center;font-weight:800" data-b="' + j + '">' + esc(b) + '</button>';
    });
    el.innerHTML = h + '</div>';
    el.querySelectorAll('[data-b]').forEach(function(b){
      b.onclick = function(){
        if(+b.dataset.b === it[1]){
          R.si++;
          if(R.si >= R.it.length){
            R.ok = !R.err;
            finish();
            return;
          }
          inner();
        } else {
          R.err = true;
          b.classList.add('bad');
        }
      };
    });
  } else if(q.k === "story"){
    var sc = q.s[R.so];
    if(!sc){ el.innerHTML = '<p class="sub" style="text-align:center">Mission complete!</p>'; return; }
    h = '<div class="fact"><p>' + esc(sc.t) + '</p></div>';
    if(R.pk === null){
      sc.o.forEach(function(o, j){
        h += '<button class="opt" data-s="' + j + '">' + esc(o[0]) + '</button>';
      });
    } else {
      var oo = sc.o[R.pk];
      h += '<div class="tile" style="border-left-color:var(--' + (oo[1] ? 'ok' : 'no') + ')"><span class="dot">' + (oo[1] ? '✅' : '⚠️') + '</span><p>' + esc(oo[2]) + '</p></div><button class="btn" id="sn">' + (R.so + 1 >= q.s.length ? 'Finish mission' : 'Next scene') + '</button>';
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-s]').forEach(function(b){
      b.onclick = function(){
        R.pk = +b.dataset.s;
        if(!sc.o[R.pk][1]) R.err = true;
        inner();
      };
    });
    var sn = document.getElementById('sn');
    if(sn) sn.onclick = function(){
      R.pk = null;
      R.so++;
      if(R.so >= q.s.length){
        R.ok = !R.err;
        finish();
      } else {
        inner();
      }
    };
  } else if(q.k === "flip"){
    el.innerHTML = '<div class="flip" id="fl">' + (R.rev ? esc(q.r) : '<em>Think of your answer, then tap to reveal.</em>') + '</div>' + (R.pyq && !R.rev ? '<p class="tmr" id="tm"></p>' : '');
    document.getElementById("fl").onclick = function(){
      clearInterval(IV);
      R.rev = true;
      inner();
      foot();
    };
    if(R.pyq && !R.rev) pyTimer();
  }
  if(R.ok !== null && R.isPractice){
    var dh = '<div class="debrief-box ' + (R.ok ? 'debrief-ok' : 'debrief-no') + '">' +
      '<div class="debrief-hdr">' +
        '<span class="debrief-badge">' + (R.ok ? '✅ Nailed it!' : '❌ Concept Trap Triggered!') + '</span>' +
        (R.cur.again ? '<span class="debrief-retry-pill">🔁 Mastery Retry</span>' : '') +
      '</div>' +
      (q.kw ? '<div class="debrief-kw"><span class="debrief-kw-lbl">🔑 Core Rule:</span> <strong>' + esc(q.kw) + '</strong></div>' : '') +
      '<div class="debrief-desc">' + esc(R.msg !== undefined ? R.msg : (q.e || '')) + '</div>' +
      (q.data ? '<div class="debrief-row debrief-data"><span class="debrief-tag">📊 Benchmark Data</span><div>' + esc(q.data) + '</div></div>' : '') +
      (q.ex ? '<div class="debrief-row debrief-ex"><span class="debrief-tag">⚡ Case Scenario</span><div>' + esc(q.ex) + '</div></div>' : '') +
      (q.mains ? '<div class="debrief-row debrief-mains"><span class="debrief-tag">🏛️ Mains Value-Add</span><div>' + esc(q.mains) + '</div></div>' : '') +
      (!R.ok ? '<div class="debrief-recycle-note">💡 <em>Hypercorrection: This challenge will return at the end of the session until mastered.</em></div>' : '') +
    '</div>';
    el.insertAdjacentHTML('beforeend', dh);
  }
}

function foot(){
  var f = document.getElementById("foot"), q = R.q;
  f.className = "foot";
  if(R.ok !== null){
    f.className = "foot " + (R.ok ? "ok" : "no");
    if(R.isPractice){
      f.innerHTML = '<button class="btn" id="go">' + (R.ok ? 'Got it · Continue →' : 'Understood · Continue →') + '</button>';
    } else {
      f.innerHTML = '<h3>🦉 ' + owlSay() + '</h3><p>' + esc(R.msg !== undefined ? R.msg : (q.e || "")) + '</p><button class="btn" id="go">Continue</button>';
    }
    document.getElementById("go").onclick = done;
    return;
  }
  if(q.k === "flip"){
    f.innerHTML = R.rev ? '<div class="two"><button class="btn" id="miss" style="background:var(--no);border-color:#a82a2f;color:#fff">Missed it</button><button class="btn" id="got">Got it</button></div>' : '<button class="btn" disabled>Reveal first</button>';
    if(R.rev){
      document.getElementById("got").onclick = function(){ R.ok = true; R.msg = ""; finish(); };
      document.getElementById("miss").onclick = function(){ R.ok = false; R.msg = "We’ll bring it back in a moment."; finish(); };
    }
    return;
  }
  if(q.k === "match" || q.k === "sort" || q.k === "story"){
    f.innerHTML = '<button class="btn" disabled>' + (q.k === "story" ? "Make your choices" : q.k === "sort" ? "Sort every card" : "Match all pairs") + '</button>';
    return;
  }
  var ready = q.k === "order" ? R.sel.length === q.o.length : R.sel.length > 0;
  f.innerHTML = '<button class="btn" id="chk"' + (ready ? '' : ' disabled') + '>Check</button>';
  document.getElementById("chk").onclick = function(){
    var ok;
    if(q.k === "order") ok = R.sel.every(function(v, i){ return v === i; });
    else if(q.k === "multi") ok = R.sel.length === q.a.length && q.a.every(function(v){ return R.sel.indexOf(v) > -1; });
    else if(q.k === "year") ok = Math.abs(R.sel[0] - q.a) <= (q.tol || 0);
    else ok = R.sel[0] === q.a;
    R.ok = ok;
    R.msg = undefined;
    finish();
  };
}

function finish(){
  if(R.ok){ R.xp += 10; R.cb = (R.cb || 0) + 1; }
  else {
    if(!R.isPractice) R.hearts--;
    R.mist++;
    R.cb = 0;
  }
  beep(R.ok);
  try { navigator.vibrate && navigator.vibrate(R.ok ? 15 : [40, 30, 40]); } catch(e) {}
  inner(); foot();
  if(R.isPractice){
    setTimeout(function(){
      var b = document.querySelector(".body");
      if (b) {
        var dBox = b.querySelector(".debrief-box");
        if (dBox) {
          dBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' });
        }
      }
    }, 60);
  }
}

function done(){
  var k = R.cur.key, i;
  if(R.ok){
    R.solved++;
    if(k && !R.cur.again){
      i = S.weak.indexOf(k);
      if(i > -1) S.weak.splice(i, 1);
    }
  } else {
    if(k && S.weak.indexOf(k) < 0) S.weak.push(k);
    // Practice model: always recycle until mastered
    R.queue.push({ q: R.cur.q, again: true, key: k });
  }
  save(); next();
}

function fin(win){
  if(R.review) return finRev(win);
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  var nq = l.q.length, pct = Math.max(0, Math.round((nq - R.mist)/nq * 100));
  if(win){
    addXp(R.xp);
    S.done[CUR_TOPIC] = S.done[CUR_TOPIC] || {};
    if(!S.done[CUR_TOPIC][R.i] || S.done[CUR_TOPIC][R.i] < pct) S.done[CUR_TOPIC][R.i] = pct;
    save();
  }

  var nextIdx = R.i + 1;
  var hasNext = (nextIdx < top.lessons.length);
  var nextLessonObj = hasNext ? top.lessons[nextIdx] : null;
  var autoTimer = null;

  var h = '<div class="end"><div class="big">' + (win ? '🏆' : '💔') + '</div>' +
    '<h1>' + (win ? 'Lesson complete!' : 'Out of hearts') + '</h1>' +
    '<p class="sub">' + (win ? esc(l.n) + ' cleared.' : 'Re-read the cards and try again.') + '</p>' +
    (win ? '<div class="stats"><div class="stat">+' + R.xp + '<small>XP</small></div><div class="stat">' + pct + '%<small>Accuracy</small></div>' + (R.isPractice ? '<div class="stat">100%<small>Mastery</small></div>' : '<div class="stat">' + R.hearts + '<small>Hearts left</small></div>') + '</div>' : '<div style="height:24px"></div>');

  if (win && hasNext && nextLessonObj) {
    h += '<div style="background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:12px 16px;margin:10px 0 16px;max-width:340px;width:100%">' +
      '<div style="font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:0.04em">Up Next · Auto-advancing</div>' +
      '<div style="font-size:16px;font-weight:800;color:var(--ink);margin:4px 0 2px">' + esc(nextLessonObj.e) + ' ' + esc(nextLessonObj.n) + '</div>' +
      '<div style="font-size:13px;color:var(--mut)">Starting in <b id="sec-cnt">3</b>s...</div>' +
    '</div>' +
    '<button class="btn" id="btn-next" style="max-width:320px;margin-bottom:8px;background:var(--ok);border-color:#0d7753;color:#fff">Start Next Lesson Now →</button>' +
    '<button class="btn" id="a" style="max-width:320px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink)">Back to Lessons</button>';
  } else if (win) {
    h += '<div style="background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:12px 16px;margin:10px 0 16px;max-width:340px;width:100%">' +
      '<div style="font-size:12px;font-weight:700;color:var(--accd);text-transform:uppercase;letter-spacing:0.04em">👑 All Lessons Cleared!</div>' +
      '<div style="font-size:16px;font-weight:800;color:var(--ink);margin:4px 0 2px">Topic Mastered!</div>' +
    '</div>' +
    '<button class="btn" id="a" style="max-width:320px">Back to Dashboard</button>';
  } else {
    h += '<button class="btn" id="btn-retry" style="max-width:320px;margin-bottom:8px">Try again</button>' +
      '<button class="btn" id="a" style="max-width:320px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink)">Back to Lessons</button>';
  }

  h += '</div>';
  app.innerHTML = h;

  if (win && hasNext && nextLessonObj) {
    var sec = 3;
    autoTimer = setInterval(function(){
      sec--;
      var cnt = document.getElementById('sec-cnt');
      if (cnt) cnt.textContent = sec;
      if (sec <= 0) {
        clearInterval(autoTimer);
        start(nextIdx);
      }
    }, 1000);
    var bn = document.getElementById('btn-next');
    if (bn) bn.onclick = function(){ clearInterval(autoTimer); start(nextIdx); };
  }

  var btnRetry = document.getElementById('btn-retry');
  if (btnRetry) btnRetry.onclick = function(){ start(R.i); };

  document.getElementById("a").onclick = function(){
    if (autoTimer) clearInterval(autoTimer);
    home();
  };

  if(win) confetti();
}

var deferredInstallPrompt = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('[PWA] Service Worker registered with scope:', reg.scope);
    }).catch(function(err) {
      console.warn('[PWA] Service Worker registration failed:', err);
    });
  });
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  var b = document.getElementById('btn-install');
  if (b) b.style.display = 'inline-flex';
});

window.addEventListener('appinstalled', function() {
  deferredInstallPrompt = null;
  var b = document.getElementById('btn-install');
  if (b) b.style.display = 'none';
  confetti();
});

function isStandalone() {
  try {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || (window.navigator && window.navigator.standalone === true);
  } catch(e) {
    return false;
  }
}

function triggerInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        var b = document.getElementById('btn-install');
        if (b) b.style.display = 'none';
      }
      deferredInstallPrompt = null;
    });
  } else {
    showInstallModal();
  }
}

function showInstallModal() {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var old = document.getElementById('install-modal');
  if (old) old.remove();

  var m = document.createElement('div');
  m.id = 'install-modal';
  m.className = 'modal-overlay';
  m.innerHTML = '<div class="modal-sheet">' +
    '<h2>📲 Install on Chrome / Mobile</h2>' +
    '<p>Install this app on your device for 1-tap home screen access, ultra-smooth offline drills, and a clean full-screen learning window.</p>' +
    '<div class="modal-steps">' +
      (isIOS ?
        '<div class="modal-step"><span class="num">1</span><span>Tap the <b>Share button</b> (⎋) at the bottom</span></div>' +
        '<div class="modal-step"><span class="num">2</span><span>Scroll down & tap <b>"Add to Home Screen"</b></span></div>' +
        '<div class="modal-step"><span class="num">3</span><span>Tap <b>Add</b> in the top right</span></div>'
      :
        '<div class="modal-step"><span class="num">1</span><span>Tap the <b>three dots menu (⋮)</b> in Chrome</span></div>' +
        '<div class="modal-step"><span class="num">2</span><span>Tap <b>"Install app"</b> or <b>"Add to Home screen"</b></span></div>' +
        '<div class="modal-step"><span class="num">3</span><span>Confirm <b>Install</b></span></div>'
      ) +
    '</div>' +
    '<button class="btn" id="modal-close">Got it</button>' +
  '</div>';
  document.body.appendChild(m);
  document.getElementById('modal-close').onclick = function() { m.remove(); };
  m.onclick = function(e) { if (e.target === m) m.remove(); };
}

home();
</script></body></html>
