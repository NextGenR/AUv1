hile inaction carries zero penalty."}]}, {"n": "The Generalist Model: Virtues & Enduring Relevance", "e": "🌾", "d": "Grassroots field exposure, cross-departmental integration, disaster leadership & federal glue", "c": [{"t": "Grassroots Field Exposure & The Human Face", "b": ["Early-career postings as <b>Sub-Divisional Magistrate (SDM)</b> and <b>District Magistrate (DM)</b> immerse officers directly in rural poverty, caste dynamics, and agrarian distress.", "This field grounding brings a vital <b>'human face'</b> to Secretariat policymaking, preventing detached, technocratic ivory-tower decisions.", "Generalists understand realistic ground-level implementation friction that domain specialists without district exposure often miss."], "k": ["Grassroots Field Exposure", "District Magistrate Reality", "Human Face to Policy"], "n": "Core argument for 2026 Q8: why the generalist structure remains essential in a diverse developing democracy."}, {"t": "Cross-Sectoral Integrator & Disaster Crisis Commander", "b": ["<b>Holistic Inter-Departmental Coordination:</b> At district and state levels, generalists act as neutral integrators across line departments (Health, PWD, Police, Agriculture), breaking narrow specialist <b>'tunnel vision'</b>.", "<b>Disaster & Emergency Leadership:</b> In complex crises (<b>COVID-19 pandemic</b>, <b>Cyclone Dana & Remal evacuations</b>), generalists excel at rapid mobilization, command-and-control, and inter-agency synergy.", "<b>Federal Glue:</b> All-India Services (IAS/IPS) provide a unified administrative vocabulary, bridging Centre-State operational friction (<b>Sardar Patel's 'Steel Frame' vision</b>)."], "k": ["Cross-Sectoral Integrator", "Crisis Leadership", "Cyclone Remal/Dana", "Federal Glue"], "n": "Cite COVID-19 pandemic response and Cyclone Dana/Remal evacuations as real-world proof of generalist crisis agility."}, {"t": "Buffer for the Political Executive", "b": ["Ministers are democratic political generalists who require technical proposals translated from specialized jargon into politically viable, constitutional options.", "The generalist civil servant acts as an essential <b>cognitive buffer</b>, synthesizing financial, legal, social, and political consequences for the Cabinet.", "Ensures policy aligns with constitutional morality, public sentiment, and parliamentary accountability."], "k": ["Political Buffer", "Jargon Translation", "Constitutional Soundness"], "n": "Generalists ensure technical proposals survive democratic, parliamentary, and judicial scrutiny."}], "q": [{"k": "mc", "q": "In disaster management (e.g. Cyclone Remal, COVID-19 pandemic), what is the primary strength of a generalist District Magistrate?", "o": ["Neutral inter-departmental command and rapid multi-agency resource mobilization", "Expert meteorological forecasting and mathematical modeling", "Direct biomedical vaccine development", "Commercial contract re-negotiation"], "a": 0, "e": "Generalists excel at coordinating police, health, food supply, and revenue departments under a unified command."}, {"k": "tf", "q": "Sardar Vallabhbhai Patel advocated abolishing All-India Services to make all bureaucratic posts purely state-level specialized cadres.", "a": 1, "e": "False. Sardar Patel vigorously defended All-India Services in the Constituent Assembly as the indispensable 'Steel Frame' for national unity."}, {"k": "multi", "q": "Select all major advantages of the generalist structure in contemporary Indian governance.", "o": ["Grassroots exposure via SDM/DM postings bringing a human face to policy", "Neutral cross-departmental coordination preventing specialist tunnel vision", "Crisis mobilization during pandemics and natural disasters", "Lifetime deep domain expertise in biotechnology and semiconductor physics"], "a": [0, 1, 2], "e": "Grassroots exposure, coordination, and crisis leadership are generalist strengths; lifetime technical depth is a specialist domain."}, {"k": "order", "q": "Order the grassroots administrative career path that builds the generalist perspective.", "o": ["Sub-Divisional Magistrate (SDM / Field Realities)", "District Magistrate (DM / Cross-Departmental Coordination)", "State Line Department Director (State Policy Execution)", "Central Secretariat Joint Secretary (National Policy Formulation)"], "e": "SDM → DM → State Director → Central Joint Secretary."}]}, {"n": "Generalist Limitations in the Modern Knowledge Economy", "e": "💻", "d": "Asymmetry in complex domains, 18-month transfers, Big Four dependency & specialist demotivation", "c": [{"t": "Asymmetry in Complex & Emerging Domains", "b": ["Modern governance spans <b>FinTech, WTO dispute litigation, semiconductor supply chains, carbon markets, AI governance, and cybersecurity</b>.", "These areas require deep technical literacy and specialized methodologies that a generalist transferred every 18 months cannot acquire.", "As the UK's <b>Fulton Committee (1968)</b> cautioned, relying on the <b>'cult of the amateur'</b> leads to superficial regulations outmatched by global counterpart agencies."], "k": ["Complex Emerging Domains", "18-Month Rotation", "Fulton Committee 1968", "Cult of the Amateur"], "n": "Direct response to the limitations dimension of 2026 Q8."}, {"t": "Erosion of Institutional Memory & Big Four Dependency", "b": ["<b>Hyper-Frequent Transfers:</b> Officers shifting across unrelated portfolios (e.g. Textiles → Space → Health within 3 years) wipes out institutional memory.", "<b>Outsourcing Core Governance:</b> To bridge technical gaps, ministries increasingly rely on external private management consultants (<b>Big Four: PwC, EY, Deloitte, KPMG</b>).", "Creates risks of policy capture, corporate influence over sovereign decisions, and weakens internal state capability."], "k": ["Erosion of Institutional Memory", "Big Four Dependency", "Policy Capture", "Hollow State"], "n": "The 'Big Four dependency' is a powerful critical phrase to demonstrate contemporary depth in Mains."}, {"t": "Demotivation of Domain Specialists & Flawed Regulations", "b": ["<b>Monopolization of Top Posts:</b> Reservation of Joint Secretary and Secretary posts predominantly for the generalist IAS demotivates specialized services (IRS, IA&AS, IES, scientists, engineers).", "<b>Flawed Policy Design:</b> Inadequate domain grasp leads to unworkable public tenders, retrospective taxation controversies, and judicial strikes.", "Technical line officers feel reduced to second-class functionaries despite possessing decades of domain expertise."], "k": ["Specialist Demotivation", "Secretariat Monopolization", "Flawed Policy Design", "Retrospective Tax"], "n": "Monopolization creates inter-service rivalry and diminishes organizational morale."}], "q": [{"k": "mc", "q": "Which landmark UK committee criticized the civil service for its 'cult of the amateur' and recommended technical specialization?", "o": ["Fulton Committee (1968)", "Macaulay Committee (1854)", "Sarkaria Commission (1988)", "Kothari Commission (1976)"], "a": 0, "e": "The Fulton Committee (1968) famously condemned the amateur generalist tradition in modern British and Commonwealth administration."}, {"k": "multi", "q": "Tap all verified limitations of relying purely on generalists in contemporary governance.", "o": ["Technical asymmetry in sectors like AI, carbon markets, and WTO litigation", "Erosion of institutional memory due to frequent 18-month transfers", "Over-reliance on private 'Big Four' consultants for policy drafting", "Complete inability to maintain law and order during district riots"], "a": [0, 1, 2], "e": "Technical asymmetry, memory erosion, and consultant reliance are core limitations; generalists excel at district law and order."}, {"k": "riddle", "q": "Solve the bureaucratic riddle.", "c": ["I am rotated every 18 months across completely unrelated ministries.", "I rely heavily on external Big Four consultants to draft technical regulations.", "The Fulton Committee in 1968 described my dominance as the 'cult of the amateur'."], "o": ["Amateur Generalist", "Domain Specialist", "Chief Vigilance Officer", "Cabinet Secretary"], "a": 0, "e": "The Amateur Generalist faces severe domain deficits when managing complex technical sectors."}, {"k": "tf", "q": "Frequent inter-departmental transfers every 18 months help build deep institutional memory in high-tech ministries like Electronics and Biotechnology.", "a": 1, "e": "False. Frequent transfers erode institutional memory, forcing departments to outsource institutional knowledge to private consultancies."}]}, {"n": "Specialist Pioneers & The Lateral Entry Dilemma", "e": "🥛", "d": "Kurien, Swaminathan, Sreedharan, Nilekani, Aspirational Districts & August 2024 rollback", "c": [{"t": "Landmark Specialist Successes in India", "b": ["<b>Dr. Verghese Kurien:</b> Specialist engineer-technocrat who led Operation Flood (White Revolution), transforming India into the world's largest milk producer.", "<b>M.S. Swaminathan</b> (Green Revolution), <b>E. Sreedharan</b> (Delhi Metro timely delivery), and <b>Nandan Nilekani</b> (Aadhaar / UIDAI digital infrastructure).", "<b>Parameswaran Iyer:</b> Sanitation specialist inducted laterally as Secretary, Ministry of Drinking Water & Sanitation, driving Swachh Bharat Mission execution."], "k": ["Dr. Verghese Kurien", "M.S. Swaminathan", "E. Sreedharan", "Nandan Nilekani", "Parameswaran Iyer"], "n": "Memorize these 5 specialist success icons for your Mains essay and GS-2 answers."}, {"t": "Generalist-Specialist Synergy: Aspirational Districts", "b": ["NITI Aayog's <b>Aspirational Districts Programme (ADP)</b> proves generalists and specialists are complementary, not mutually exclusive.", "Generalist District Collectors partnered with sector specialists, technical development partners, and real-time data dashboards (<b>Champions of Change</b>).", "Result: Accelerated indicators in health, nutrition, and basic infrastructure through cross-sectoral convergence."], "k": ["Aspirational Districts Programme", "Champions of Change", "Complementary Synergy"], "n": "Use ADP as a live proof that collaborative synergy beats zero-sum conflict."}, {"t": "The Lateral Entry Dilemma & Reservation Safeguards (2024–2025)", "b": ["Lateral entry recruits outside domain experts into Joint Secretary, Director, and Deputy Secretary roles on 3-to-5 year contracts.", "<b>August 2024 Controversy:</b> UPSC withdrew an advertisement for 45 lateral entry posts following intense concerns regarding the absence of <b>SC/ST/OBC constitutional reservations</b> in single-post selections.", "Demonstrates the urgent need for a <b>statutory, institutionalized lateral entry framework</b> that balances domain talent infusion with affirmative social justice."], "k": ["Lateral Entry", "August 2024 UPSC Withdrawal", "Constitutional Reservation Safeguards"], "n": "High-yield 2024-2026 update: lateral entry must harmonize technical excellence with social equity."}], "q": [{"k": "match", "q": "Match the specialist pioneer to their institutional breakthrough.", "p": [["Dr. Verghese Kurien", "Operation Flood & White Revolution"], ["E. Sreedharan", "Delhi Metro precision delivery"], ["Nandan Nilekani", "Aadhaar UIDAI digital architecture"], ["Parameswaran Iyer", "Swachh Bharat Mission lateral leadership"]], "e": "Kurien (Amul/Milk), Sreedharan (Metro), Nilekani (Aadhaar), and Iyer (Swachh Bharat) are prime examples of specialist impact."}, {"k": "tf", "q": "In August 2024, UPSC withdrew its advertisement for 45 lateral entry posts following debate over constitutional reservation safeguards.", "a": 0, "e": "True. The government directed UPSC to cancel the ad to ensure lateral entry complies with constitutional social justice principles."}, {"k": "mc", "q": "How did NITI Aayog's Aspirational Districts Programme achieve generalist-specialist synergy?", "o": ["Generalist Collectors used real-time data dashboards and collaborated with domain partners", "By completely replacing IAS officers with private sector CEOs", "By abolishing state line departments in aspirational districts", "By freezing all transfers for 20 years"], "a": 0, "e": "Collectors acted as project anchors, integrating specialist insights and real-time dashboard data."}, {"k": "year", "q": "Slide to the year of the controversial 45-post UPSC lateral entry ad withdrawal that spotlighted reservation safeguards.", "a": 2024, "tol": 0, "min": 2020, "max": 2026, "e": "In August 2024, the Prime Minister directed the withdrawal of the 45-post lateral entry advertisement."}]}, {"n": "Administrative Reform Blueprints & Committee Recommendations", "e": "📋", "d": "1st ARC, Surinder Nath 2003, 2nd ARC 10th & 13th reports, and Mission Karmayogi FRAC", "c": [{"t": "1st ARC (1966) & Surinder Nath Committee (2003)", "b": ["<b>1st ARC (1966):</b> Recommended grouping senior civil service positions into <b>8 functional areas</b> for mid-career specialization.", "<b>Surinder Nath Committee (2003):</b> Proposed categorizing officers into <b>11 domain clusters</b> (e.g. Infrastructure, Security, Trade, Social Sector) based on aptitude and demonstrated track record.", "Recognized that civil servants cannot remain generic generalists throughout a 35-year career span."], "k": ["1st ARC 1966 (8 Functional Areas)", "Surinder Nath 2003 (11 Clusters)"], "n": "Citing 1st ARC and Surinder Nath proves historical committee mastery in GS-2."}, {"t": "2nd ARC Recommendations (10th & 13th Reports)", "b": ["<b>2nd ARC 10th Report (Refurbishing Personnel Administration):</b> Domain assignment after <b>13 years of service</b>; open competitive bidding for Senior Administrative Grade (SAG/HAG) posts.", "<b>2nd ARC 13th Report (Organizational Structure of GoI):</b> Replace rigid vertical hierarchies with <b>flatter, mission-mode structures</b> and autonomous executive agencies.", "Advocated establishing a statutory Central Civil Services Authority to depoliticize senior postings and transfers."], "k": ["2nd ARC 10th Report (13-Year Rule)", "2nd ARC 13th Report (Flatter Structures)", "Central Civil Services Authority"], "n": "The 13-year threshold is the gold-standard recommendation for mid-career specialization."}, {"t": "Mission Karmayogi & The FRAC Architecture", "b": ["<b>NPCSCB (Mission Karmayogi):</b> Shifts civil service human resources from 'Rule-Based' to <b>'Role-Based'</b> governance.", "<b>FRAC Framework:</b> Framework of Roles, Activities, and Competencies; maps exact behavioral, functional, and domain competencies required for each post.", "Delivered through the <b>iGOT Karmayogi</b> platform for continuous, anytime-anywhere digital capacity building."], "k": ["Mission Karmayogi", "Rule-Based to Role-Based", "FRAC Framework", "iGOT Karmayogi"], "n": "Mission Karmayogi is the active flagship reform governing civil service capacity building today."}], "q": [{"k": "mc", "q": "What service milestone did the 2nd ARC (10th Report) recommend for mandatory domain specialization of civil servants?", "o": ["13 years of service", "3 years of service", "25 years of service", "Immediate entry upon UPSC exam"], "a": 0, "e": "The 2nd ARC recommended generalist field service for the first 13 years, followed by competitive domain specialization."}, {"k": "multi", "q": "Select all key pillars of Mission Karmayogi (NPCSCB).", "o": ["Shift from 'Rule-Based' to 'Role-Based' talent management", "FRAC (Framework of Roles, Activities, and Competencies) mapping", "Continuous digital learning through iGOT Karmayogi portal", "Abolition of UPSC and reinstatement of imperial patronage"], "a": [0, 1, 2], "e": "Role-based HR, FRAC competency mapping, and iGOT portal are the 3 pillars of Mission Karmayogi."}, {"k": "order", "q": "Order the reform proposals from oldest to most recent.", "o": ["1st ARC: 8 functional specialization areas (1966)", "Surinder Nath Committee: 11 domain clusters (2003)", "2nd ARC 10th Report: 13-year specialization rule (2009)", "Mission Karmayogi: FRAC competency architecture (2020)"], "e": "1st ARC (1966) → Surinder Nath (2003) → 2nd ARC (2009) → Mission Karmayogi (2020)."}, {"k": "tf", "q": "Mission Karmayogi promotes procedural rule-compliance as the supreme metric for officer promotions.", "a": 1, "e": "False. It explicitly transitions HR from 'Rule-Based' compliance to 'Role-Based' competency and outcome delivery."}]}, {"n": "The 'Bamboo Frame' & Mains Answer Writing Mastery", "e": "🎋", "d": "From Steel Frame to Bamboo Frame, Desk Officer 3-tier system & 45-second PYQ skeletons", "c": [{"t": "Re-Imagining the Steel Frame into a 'Bamboo Frame'", "b": ["Contemporary governance should not frame generalist vs specialist as a zero-sum, either/or binary.", "Must evolve from Sardar Patel's colonial <b>'Steel Frame'</b> into a collaborative <b>'Bamboo Frame'</b>: deeply rooted in grassroots reality, flexible against economic shocks, and specialized at the apex.", "Merges the generalist's holistic cross-sectoral coordination with the specialist's precision in frontier domains."], "k": ["Bamboo Frame", "Non-Binary Synergy", "Grassroots Roots + Apex Specialization"], "n": "Writing the 'Bamboo Frame' metaphor in your conclusion will distinguish your copy from thousands of competitors."}, {"t": "Four Pillars of Comprehensive Bureaucratic Reform", "b": ["<b>Generalist-Plus Model:</b> Retain unified entry and district postings for the first <b>10–12 years</b>, followed by mandatory specialization in 2–3 core sectors.", "<b>Institutionalized Lateral Entry:</b> Transparent, UPSC-led recruitment incorporating constitutional reservation quotas to ensure talent infusion with social equity.", "<b>De-Layering the Secretariat:</b> Expand the Central Secretariat Desk Officer System to cap file-noting hierarchies at a maximum of three tiers.", "<b>3Cs Safe Harbor:</b> Statutory guidelines distinguishing genuine bona-fide commercial/policy decisions from criminal misconduct (mens rea), ending policy paralysis."], "k": ["Generalist-Plus Model", "Institutionalized Lateral Entry", "Desk Officer 3-Tier De-layering", "3Cs Safe Harbor"], "n": "Four actionable, high-scoring recommendations for your 'Way Forward'."}, {"t": "Mains Skeletons: 2016 Q14 & 2026 Q8", "b": ["<b>2016 Skeleton (150W):</b> Intro (Macaulay colonial DNA) → Structural flaws (Hierarchy, Water silos, 3Fs) → Cultural flaws (Red-tape, Mai-baap, 3Cs paralysis) → Reforms (Karmayogi, Desk Officer, Bamboo Frame).", "<b>2026 Skeleton (150W):</b> Intro (Northcote-Trevelyan vs knowledge economy) → 5 Advantages (Grassroots face, Integrator, Disaster commander, Federal glue, Political buffer) → 4 Limitations (Asymmetry in FinTech/AI, 18-mo transfers, Big 4 dependency, Specialist alienation) → Way Forward (Generalist-Plus, 2nd ARC 13-yr rule, Bamboo Frame).", "Practice writing these structured points under strict 7-minute time pressure."], "k": ["2016 45-Second Skeleton", "2026 45-Second Skeleton", "High-Scoring Diagnostic Terms"], "n": "Memorize the skeleton bullet points for rapid mental recall in the exam hall."}], "q": [{"k": "mc", "q": "What does the 'Bamboo Frame' metaphor for Indian civil services symbolize?", "o": ["A flexible, shock-resistant administration deeply rooted in grassroots realities with apex domain specialization", "A wooden, brittle administrative structure prone to rapid corruption", "Complete privatization of the civil services under corporate leadership", "Abolition of the permanent executive in favor of annual political appointments"], "a": 0, "e": "The 'Bamboo Frame' combines deep grassroots roots (field generalist exposure) with apex flexibility and domain expertise."}, {"k": "multi", "q": "Tap all essential structural reforms recommended to modernize Indian bureaucracy.", "o": ["Generalist-Plus model: mandatory domain specialization after 10-12 years", "De-layering the Secretariat to a maximum of 3 file-noting tiers via Desk Officer system", "Statutory safe-harbor protection for bona-fide risk-taking against the 3Cs", "Complete elimination of competitive entrance examinations"], "a": [0, 1, 2], "e": "Generalist-Plus, Secretariat de-layering, and 3Cs safe-harbor are high-scoring reform pillars."}, {"k": "match", "q": "Match the bureaucratic reform to its direct governance outcome.", "p": [["Generalist-Plus Model", "Domain specialization after 10-12 years field service"], ["Desk Officer System", "Capping Secretariat file noting to max 3 tiers"], ["FRAC Architecture", "Role-based competency mapping under Mission Karmayogi"], ["3Cs Safe Harbor", "Overcoming risk aversion and policy paralysis"]], "e": "Generalist-Plus builds mid-career depth; Desk Officer cuts red tape; FRAC maps roles; 3Cs protection restores bold decision-making."}, {"k": "order", "q": "Build the conclusion sentence: tap the words in order.", "o": ["Evolve", "colonial", "steel", "frame", "into", "collaborative", "bamboo", "frame"], "e": "Evolve colonial steel frame into collaborative bamboo frame."}]}], "pyq": [{"q": "UPSC Mains 2016 (GS-2, 12.5 Marks): 'Traditional bureaucratic structure and culture have hampered the process of socio-economic development in India.' Comment.", "a": "<b>1. Introduction:</b> Rooted in the Macaulay Committee (1854) and Weberian legal-rationalism, the Indian Civil Service was designed as a colonial 'Steel Frame' for law-and-order maintenance and revenue extraction, rather than dynamic socio-economic development.<br><br><b>2. Structural Bottlenecks:</b><br>• Rigid Hierarchy: 6-8 layers of file noting causing cost and time overruns.<br>• Departmental Silos: Water governance split across Jal Shakti, Agriculture, Environment, and Rural Development.<br>• Centralized Command: Secretariat holds power, starving Panchayats of 3Fs (73rd/74th Amendments).<br><br><b>3. Cultural Bottlenecks:</b><br>• Rule-Orientation (Red-Tapism): Procedure prioritized over public delivery.<br>• 'Mai-Baap' Paternalism: Citizens treated as passive charity recipients, not rights-holders.<br>• Fear of 3Cs (CBI, CVC, CAG): APAR penalizes commission but ignores omission, driving policy paralysis.<br><br><b>4. Way Forward:</b> Shift to Role-Based HR under Mission Karmayogi (FRAC), de-layer Secretariat to 3 tiers via Desk Officer system, grant safe harbor for bona-fide risk, and evolve from a rigid 'Steel Frame' into a collaborative 'Bamboo Frame'."}, {"q": "UPSC Mains 2026 (GS-2, 10 Marks): 'Analyse the advantages and limitations of the generalist structure of the Indian Civil Services in contemporary governance.'", "a": "<b>1. Introduction:</b> The Northcote-Trevelyan (1854) model of the 'all-rounder generalist' faces severe structural stress as India transitions into a complex knowledge economy managing AI, semiconductor supply chains, and climate finance.<br><br><b>2. Advantages (Enduring Relevance):</b><br>• Grassroots Field Grounding: SDM/DM postings bring a human face to Secretariat policymaking.<br>• Inter-Departmental Integrator: Neutral arbiter preventing line-department tunnel vision.<br>• Disaster Leadership: Rapid command-and-control during COVID-19 and Cyclone Dana/Remal.<br>• Federal Glue: All-India Services unify Centre and States (Sardar Patel's vision).<br>• Political Buffer: Translates specialist jargon into constitutional policy for Ministers.<br><br><b>3. Limitations in Contemporary Governance:</b><br>• Technical Asymmetry: Inability to master FinTech, WTO disputes, or carbon markets in 18-month stints.<br>• Erosion of Memory: Rapid transfers create dependency on private consultancies ('Big Four').<br>• Demotivation: IAS monopoly over Secretariat posts alienates technical services (IRS, IES, scientists).<br>• Flawed Regulations: Unworkable tenders and retrospective taxation controversies.<br><br><b>4. Conclusion:</b> Adopt the 'Generalist-Plus' model (2nd ARC 13-year rule): 10-12 years field service followed by domain specialization, institutionalizing lateral entry with constitutional reservation safeguards."}, {"q": "UPSC Mains 2017 (GS-2, 10 Marks): 'Initially Civil Services in India were designed to achieve the goals of neutrality and effectiveness, which seems to have been compromised in recent times.' (Part A: Neutrality & Functional Autonomy)", "a": "<b>1. Neutrality Concept:</b> Weberian civil service requires political impartiality, anonymity, and institutional permanence irrespective of electoral turnover.<br><br><b>2. Compromising Factors:</b> Arbitrary transfer industry used as political leverage; post-retirement appointment patronage; committed bureaucracy expectations; politicization of vigilance mechanisms.<br><br><b>3. Remedial Framework:</b> 2nd ARC recommended statutory Civil Services Boards with fixed tenures (P.C. Hota Committee), 2-year cooling-off period before post-retirement jobs, and transparent objective APAR metrics."}, {"q": "UPSC Mains 2020 (GS-2, 10 Marks): 'Institutional reforms are imperative to make Indian Civil Services future-ready for Viksit Bharat.' Discuss with reference to Mission Karmayogi.", "a": "<b>1. Context:</b> Shift from industrial-era bureaucracy to digital-era agile governance under the National Programme for Civil Services Capacity Building (NPCSCB).<br><br><b>2. Core Pillars of Mission Karmayogi:</b><br>• Rule-Based to Role-Based HR: Aligning officer competencies with specific job profiles.<br>• FRAC Architecture: Framework of Roles, Activities, and Competencies.<br>• Continuous Learning: Democratized training via iGOT Karmayogi digital platform.<br><br><b>3. Critical Safeguards Needed:</b> Address lateral entry reservation compliance, de-layer Secretariat hierarchies, and protect commercial risk-taking from 3Cs harassment."}], "sks": [{"t": "2016 Bureaucratic Structure & Culture (150W)", "s": ["1. Intro: Macaulay (1854) regulatory 'Steel Frame' DNA — law & order vs development.", "2. Structural: 8-tier hierarchy, water governance split (4 ministries), 3Fs starvation.", "3. Cultural: Red-tapism (rules over outcomes), 'Mai-Baap' mindset, 3Cs policy paralysis.", "4. Impact: Time/cost overruns, unspent capex, citizen friction & service delivery denial.", "5. Way Forward: Mission Karmayogi FRAC, Desk Officer de-layering, collaborative 'Bamboo Frame'."]}, {"t": "2026 Generalist Advantages vs Limitations (150W)", "s": ["1. Intro: Northcote-Trevelyan all-rounder model tested by AI, semiconductors & climate finance.", "2. Advantages: Grassroots DM grounding, inter-departmental integrator, crisis commander (COVID/Cyclones), federal glue.", "3. Limitations: Asymmetry in FinTech/WTO, 18-mo transfer memory loss, Big Four dependency, specialist alienation.", "4. Committees: Fulton (cult of amateur), 1st ARC (8 areas), 2nd ARC (13-year rule).", "5. Way Forward: 'Generalist-Plus' model, institutionalized lateral entry with reservation, 'Bamboo Frame'."]}, {"t": "Generalist-Specialist Synergy Framework (150W)", "s": ["1. Premise: Generalist vs Specialist is a false binary; governance requires symbiotic convergence.", "2. Best Practice: NITI Aayog Aspirational Districts — generalist Collectors + domain partners + data dashboard.", "3. Pioneer Icons: Kurien (Operation Flood), Sreedharan (Metro), Nilekani (Aadhaar), Iyer (Swachh Bharat).", "4. Reform Pillars: Transparent lateral entry with reservation, 3Cs safe harbor, Central Civil Services Authority.", "5. Synthesis: Deep grassroots roots (generalist) + apex domain precision (specialist) = Bamboo Frame for 2047."]}], "bg": {"b": ["Structural & Cultural Bottlenecks", "Generalist Virtues", "Bamboo Frame Reforms"], "it": [["Rigid Weberian Hierarchy", 0, "Steep vertical pyramid with 6 to 8 layers of file noting."], ["Departmental Silos", 0, "Water governance fragmented across 4 separate ministries."], ["Mai-Baap Paternalism", 0, "Viewing citizens as charity beneficiaries rather than rights-holders."], ["3Cs Fear & Policy Paralysis", 0, "Risk aversion driven by retrospective CBI, CVC, CAG scrutiny."], ["Red-Tapism", 0, "Procedural rule-compliance prioritized over public outcome delivery."], ["Grassroots Field Exposure", 1, "SDM/DM tenure provid function dropBlock(binIdx){
  clearInterval(BLK.timer);
  BLK.paused = true;
  var item = BLK.deck[BLK.idx];
  var correctIdx = item[1];
  var isOk = binIdx === correctIdx;

  if (isOk) {
    BLK.counts[binIdx] = (BLK.counts[binIdx] || 0) + 1;
    var gain = 10 * BLK.combo;
    BLK.score += gain;
    BLK.combo++;
    if (BLK.combo > BLK.maxCombo) BLK.maxCombo = BLK.combo;
    beep(true);
    var card = document.getElementById('b-card');
    if (card) card.classList.add('catch');
    var btn = app.querySelector('[data-b="' + binIdx + '"]');
    if (btn) btn.classList.add('b-ok');
    var fb = '<div class="blk-toast ok"><b>✓ Correct! +' + gain + ' XP</b> (🔥 x' + BLK.combo + ' combo)<br><small>' + esc(item[2]) + '</small></div>';
    setTimeout(function(){
      BLK.idx++;
      blkStep();
    }, 850);
  } else {
    BLK.hearts--;
    BLK.mistakes++;
    BLK.combo = 1;
    beep(false);
    var btnBad = app.querySelector('[data-b="' + binIdx + '"]');
    if (btnBad) btnBad.classList.add('b-no');
    var btnCorrect = app.querySelector('[data-b="' + correctIdx + '"]');
    if (btnCorrect) btnCorrect.classList.add('b-ok');
    var reason = binIdx === -1 ? '⏱ Out of time!' : '✕ Not quite!';
    var fb = '<div class="blk-toast no"><b>' + reason + '</b><br>Belongs in <b>' + esc(BLK.buckets[correctIdx]) + '</b>.<br><small>' + esc(item[2]) + '</small></div>' +
      '<button class="btn" id="b-next" style="margin-top:10px;padding:8px 16px;font-size:15px">Next Term →</button>';
    blkDraw(fb);
    var nxt = document.getElementById('b-next');
    if (nxt) nxt.onclick = function(){
      BLK.idx++;
      blkStep();
    };
  }
}

function blkEnd(){
  clearInterval(BLK.timer);
  var win = BLK.hearts > 0;
  var total = BLK.deck.length;
  var solved = total - BLK.mistakes;
  var pct = Math.max(0, Math.round(solved / total * 100));
  addXp(BLK.score);

  var h = '<div class="end">' +
    '<div class="big">' + (win ? '🧱' : '💔') + '</div>' +
    '<h1>' + (win ? 'Block Drop Cleared!' : 'Out of Hearts') + '</h1>' +

    '</div>' +
    '<button class="btn" id="b-again">Play Again</button>' +

function startDaily(){
  var s = 0, d = today();
  for(var i = 0; i < d.length; i++) s = (s * 31 + d.charCodeAt(i)) % 2147483647;
  var p = [];
  var top = DATA[CUR_TOPIC];
  top.lessons.forEach(function(l){
    l.q.forEach(function(q){
      if(['mc', 'tf', 'multi', 'flag', 'year'].indexOf(q.k) > -1) p.push(q);
    });
  });
  var out = [];
  while(out.length < 5 && p.length){
    s = (s * 48271) % 2147483647;
    out.push(p.splice(s % p.length, 1)[0]);
  }
  go(out, { daily: 1 });
}

function ltTimer(){
  clearInterval(IV);
  var s = 10;
  function t(){
    var k = document.querySelector('.kind');
    if(!k || R.ok !== null){ clearInterval(IV); return; }
    k.textContent = '⚡ Lightning · ' + s + 's';
    if(s-- <= 0){
      clearInterval(IV);
      R.ok = false;
      R.sel = [];
      R.msg = 'Too slow! ' + (R.q.e || '');
      finish();
    }
  }
  t();
  IV = setInterval(t, 1000);
}

function sh(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function tx(x,y,t,fs,f){
  var l = t.split('|');
  return `<text x='${x}' text-anchor='middle' font-size='${fs||13}' font-weight='700' fill='${f||'var(--ink)'}'>` +
    l.map(function(s,i){ return `<tspan x='${x}' y='${y + i*15 - (l.length-1)*7}'>${s}</tspan>`; }).join('') + '</text>';
}
function bx(x,y,w,h,t,f){
  return `<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='10' fill='${f||'var(--card)'}' stroke='var(--h)' stroke-width='2'/>` +
    tx(x+w/2, y+h/2+5, t, 12, f ? '#fff' : 0);
}
function ar(a,b,c,d){
  return `<line x1='${a}' y1='${b}' x2='${c}' y2='${d}' stroke='var(--h)' stroke-width='2.5' marker-end='url(#ar)'/>`;
}

function start(i){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[i];
  R = {
    i: i,
    ci: 0,
    queue: l.q.map(function(q, n){ return { q: q, key: CUR_TOPIC + ':' + i + ':' + n }; }),
    total: l.c.length + l.q.length,
    solved: 0,
    hearts: 5,
    mist: 0,
    xp: 0
  };
  next();
}

function next(){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  if(l && R.ci < l.c.length) return card();
  if(R.hearts <= 0) return fin(false);
  if(!R.queue.length) return fin(true);
  R.cur = R.queue.shift();
  clearInterval(IV);
  R.sel = [];
  R.ok = null;
  R.q = R.cur.q;
  var q = R.q;
  if(q.o) R.ord = sh(q.o.map(function(_, i){ return i; }));
  if(q.k === "tf") R.ord = [0, 1];
  if(q.k === "match"){
    R.L = sh(q.p.map(function(_, i){ return i; }));
    R.Rr = sh(q.p.map(function(_, i){ return i; }));
    R.m = [];
    R.pick = null;
    R.err = false;
  }
  if(q.k === "flip") R.rev = false;
  if(q.k === "flag") R.ord = q.o.map(function(_, i){ return i; });
  if(q.k === "sort"){ R.si = 0; R.err = false; R.it = sh(q.it); }
  if(q.k === "story"){ R.so = 0; R.pk = null; R.err = false; }
  if(q.k === "riddle") R.cl = 1;
  if(q.k === "year") R.sel = [Math.round((q.min + q.max) / 2)];
  draw();
}

function card(){ R.sh = 1; cardDraw(); }

function cardDraw(){
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  var c = l.c[R.ci];
  var n = c.b.length; // number of bullet points (e.g. 3)
  var tot = l.c.length;
  var hue = top.hue[R.i % top.hue.length];
  var ico = top.ico[R.i % top.ico.length][R.ci % 3] || l.e;

  // Check extra sequential steps available after bullet n
  var diagramHtml = diag(CUR_TOPIC, R.i, R.ci);
  var hasDiag = !!diagramHtml;
  var hasKw = !!(c.k && c.k.length);
  var hasOwl = !!c.n;

  var extraSteps = [];
  if (hasDiag) extraSteps.push('diag');
  if (hasKw) extraSteps.push('kw');
  if (hasOwl) extraSteps.push('owl');

  var maxStage = extraSteps.length;
  var totalCardSteps = n + maxStage;
  var currentStep = R.sh;

  var h = head() + '<div class="body" style="--h:' + hue + '">' +
    '<div class="hero"><span class="ico">' + ico + '</span><div><small>' + esc(l.n) + ' · card ' + (R.ci+1) + ' of ' + tot + '</small><h2>' + esc(c.t) + '</h2></div></div>';

  // 1. Show bullet points up to currentStep (capped at n)
  var bulletsToShow = Math.min(currentStep, n);
  for(var i = 0; i < bulletsToShow; i++){
    h += '<div class="tile' + (i === bulletsToShow - 1 && i > 0 ? ' pop' : '') + '"><span class="dot">✦</span><p>' + c.b[i] + '</p></div>';
  }

  // 2. Reveal post-bullet items sequentially ONLY when currentStep advances past n
  var postStep = currentStep - n;
  if (postStep > 0) {
    for (var s = 0; s < postStep && s < extraSteps.length; s++) {
      var stepType = extraSteps[s];
      var isLatest = (s === postStep - 1);
      if (stepType === 'diag') {
        h += '<div class="' + (isLatest ? 'pop' : '') + '">' + diagramHtml + '</div>';
      } else if (stepType === 'kw') {
        unlock(c);
        h += '<p class="kw' + (isLatest ? ' pop' : '') + '">🔑 Keywords unlocked</p><div class="chips' + (isLatest ? ' pop' : '') + '">';
        c.k.forEach(function(k){ h += '<span class="chip">' + esc(k) + '</span>'; });
        h += '</div>';
      } else if (stepType === 'owl') {
        h += '<div class="bub' + (isLatest ? ' pop' : '') + '"><span>🦉</span><p>' + esc(c.n) + '</p></div>';
      }
    }
  }

  // 3. Button label
  var isFinal = (currentStep >= totalCardSteps);
  var btnText = 'Continue';
  if (currentStep < n) {
    btnText = 'Continue (' + currentStep + '/' + n + ')';
  } else if (isFinal) {
    btnText = (R.ci === tot - 1) ? 'Got it · Start Questions →' : 'Got it · Next Card →';
  } else {
    var nextStepType = extraSteps[postStep];
    if (nextStepType === 'diag') btnText = 'Continue → Picture it';
    else if (nextStepType === 'kw') btnText = 'Continue → Keywords';
    else if (nextStepType === 'owl') btnText = 'Continue → Note';
    else btnText = 'Continue';
  }

  h += '</div><div class="foot"><button class="btn" id="go">' + btnText + '</button></div>';
  app.innerHTML = h;
  quit();

  document.getElementById("go").onclick = function(){
    if (!isFinal) {
      R.sh++;
      cardDraw();
      var b = document.querySelector(".body");
      if (b) {
        setTimeout(function(){
          b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' });
        }, 40);
      }
    } else {
      R.solved++;
      R.ci++;
      next();
    }
  };
}

var KIND = {
  riddle: "Detective: who am I?",
  story: "Officer mission",
  flag: "Spot the red flag",
  year: "Slide to the year",
  sort: "Sort the cards",
  tf: "True or false",
  mc: "Pick one",
  multi: "Select all that apply",
  order: "Put in order",
  match: "Match the pairs",
  flip: "Flip the card"
};

function draw(){
  var q = R.q;
  app.innerHTML = head() + '<div class="body"><p class="kind">' + (KIND[q.k] || '') + '</p><p class="q">' + esc(q.q) + '</p><div id="in"></div></div><div class="foot" id="foot"></div>';
  quit();
  inner();
  foot();
  if(R.lt) ltTimer();
}

function inner(){
  var q = R.q, el = document.getElementById("in"), h = "";
  if(q.k === "mc" || q.k === "riddle" || q.k === "flag" || q.k === "tf" || q.k === "multi"){
    var lab = q.k === "tf" ? ["True", "False"] : q.o;
    if(q.k === "riddle"){
      h = '<div class="fact">';
      for(var c = 0; c < R.cl; c++) h += '<p>🔎 ' + esc(q.c[c]) + '</p>';
      h += '</div>';
      if(R.cl < q.c.length && R.ok === null) {
        h += '<button class="mb" id="nc" style="width:100%;margin-bottom:12px">💡 Next clue (−3 XP)</button>';
      }
    }
    R.ord.forEach(function(i){
      h += '<button class="opt' + (q.k === "flag" ? ' fl' : '') + (R.sel.indexOf(i) > -1 ? ' sel' : '') + '" data-i="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(lab[i]) + '</button>';
    });
    el.innerHTML = h;
    var nc = document.getElementById("nc");
    if(nc) nc.onclick = function(){ R.cl++; R.xp = Math.max(0, R.xp - 3); inner(); };
    el.querySelectorAll(".opt").forEach(function(b){
      b.onclick = function(){
        var i = +b.dataset.i;
        if(q.k === "multi"){
          var p = R.sel.indexOf(i);
          p > -1 ? R.sel.splice(p, 1) : R.sel.push(i);
        } else {
          R.sel = [i];
        }
        inner(); foot();
        if(R.lt && q.k !== "multi"){
          clearInterval(IV);
          R.ok = R.sel[0] === q.a;
          R.msg = undefined;
          finish();
        }
      };
    });
  } else if(q.k === "order"){
    h = '<div class="slots' + (q.inl ? ' w' : '') + '">' + (R.sel.length ? '' : '<span class="ph">Tap the items below in order</span>');
    R.sel.forEach(function(i){
      h += '<button class="opt' + (q.inl ? ' fl' : '') + '" data-r="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(q.o[i]) + '</button>';
    });
    h += '</div>';
    R.ord.forEach(function(i){
      if(R.sel.indexOf(i) < 0) h += '<button class="opt' + (q.inl ? ' fl' : '') + '" data-a="' + i + '"' + (R.ok !== null ? ' disabled' : '') + '>' + esc(q.o[i]) + '</button>';
    });
    el.innerHTML = h;
    el.querySelectorAll("[data-a]").forEach(function(b){
      b.onclick = function(){ R.sel.push(+b.dataset.a); inner(); foot(); };
    });
    el.querySelectorAll("[data-r]").forEach(function(b){
      b.onclick = function(){ R.sel.splice(R.sel.indexOf(+b.dataset.r), 1); inner(); foot(); };
    });
  } else if(q.k === "match"){
    h = '<div class="cols"><div>';
    R.L.forEach(function(i){
      h += '<button class="opt' + (R.pick === i ? ' sel' : '') + (R.m.indexOf(i) > -1 ? ' gone' : '') + '" data-l="' + i + '">' + esc(q.p[i][0]) + '</button>';
    });
    h += '</div><div>';
    R.Rr.forEach(function(i){
      h += '<button class="opt' + (R.m.indexOf(i) > -1 ? ' gone' : '') + '" data-r="' + i + '">' + esc(q.p[i][1]) + '</button>';
    });
    el.innerHTML = h + '</div></div>';
    el.querySelectorAll("[data-l]").forEach(function(b){
      b.onclick = function(){ R.pick = +b.dataset.l; inner(); };
    });
    el.querySelectorAll("[data-r]").forEach(function(b){
      b.onclick = function(){
        if(R.pick === null) return;
        if(R.pick === +b.dataset.r){
          R.m.push(R.pick);
          R.pick = null;
          if(R.m.length === q.p.length){
            R.ok = !R.err;
            finish();
            return;
          }
          inner();
        } else {
          R.err = true;
          R.pick = null;
          inner();
          var bb = el.querySelector('[data-r="' + b.dataset.r + '"]');
          if(bb) bb.classList.add("bad");
        }
      };
    });
  } else if(q.k === "year"){
    var yv = R.sel.length ? R.sel[0] : Math.round((q.min + q.max) / 2);
    el.innerHTML = '<div class="skn" id="yv">' + (R.sel.length ? yv : '?') + '</div><input type="range" id="yr" min="' + q.min + '" max="' + q.max + '" value="' + yv + '" style="width:100%" aria-label="Year"' + (R.ok !== null ? ' disabled' : '') + '>';
    var yr = document.getElementById('yr');
    yr.onchange = yr.oninput = function(){
      R.sel = [+yr.value];
      document.getElementById('yv').textContent = yr.value;
      foot();
    };
  } else if(q.k === "sort"){
    var it = R.it[R.si];
    if(!it){ el.innerHTML = '<p class="sub" style="text-align:center">All sorted!</p>'; return; }
    h = '<p class="ph" style="text-align:center">' + (R.si + 1) + ' of ' + R.it.length + '</p><div class="flip" style="text-align:center;font-weight:800;font-size:22px;display:grid;place-items:center;cursor:default">' + esc(it[0]) + '</div><div class="cols" style="margin-top:16px">';
    q.b.forEach(function(b, j){
      h += '<button class="opt" style="text-align:center;font-weight:800" data-b="' + j + '">' + esc(b) + '</button>';
    });
    el.innerHTML = h + '</div>';
    el.querySelectorAll('[data-b]').forEach(function(b){
      b.onclick = function(){
        if(+b.dataset.b === it[1]){
          R.si++;
          if(R.si >= R.it.length){
            R.ok = !R.err;
            finish();
            return;
          }
          inner();
        } else {
          R.err = true;
          b.classList.add('bad');
        }
      };
    });
  } else if(q.k === "story"){
    var sc = q.s[R.so];
    if(!sc){ el.innerHTML = '<p class="sub" style="text-align:center">Mission complete!</p>'; return; }
    h = '<div class="fact"><p>' + esc(sc.t) + '</p></div>';
    if(R.pk === null){
      sc.o.forEach(function(o, j){
        h += '<button class="opt" data-s="' + j + '">' + esc(o[0]) + '</button>';
      });
    } else {
      var oo = sc.o[R.pk];
      h += '<div class="tile" style="border-left-color:var(--' + (oo[1] ? 'ok' : 'no') + ')"><span class="dot">' + (oo[1] ? '✅' : '⚠️') + '</span><p>' + esc(oo[2]) + '</p></div><button class="btn" id="sn">' + (R.so + 1 >= q.s.length ? 'Finish mission' : 'Next scene') + '</button>';
    }
    el.innerHTML = h;
    el.querySelectorAll('[data-s]').forEach(function(b){
      b.onclick = function(){
        R.pk = +b.dataset.s;
        if(!sc.o[R.pk][1]) R.err = true;
        inner();
      };
    });
    var sn = document.getElementById('sn');
    if(sn) sn.onclick = function(){
      R.pk = null;
      R.so++;
      if(R.so >= q.s.length){
        R.ok = !R.err;
        finish();
      } else {
        inner();
      }
    };
  } else if(q.k === "flip"){
    el.innerHTML = '<div class="flip" id="fl">' + (R.rev ? esc(q.r) : '<em>Think of your answer, then tap to reveal.</em>') + '</div>' + (R.pyq && !R.rev ? '<p class="tmr" id="tm"></p>' : '');
    document.getElementById("fl").onclick = function(){
      clearInterval(IV);
      R.rev = true;
      inner();
      foot();
    };
    if(R.pyq && !R.rev) pyTimer();
  }
}

function foot(){
  var f = document.getElementById("foot"), q = R.q;
  f.className = "foot";
  if(R.ok !== null){
    f.className = "foot " + (R.ok ? "ok" : "no");
    f.innerHTML = '<h3>🦉 ' + owlSay() + '</h3><p>' + esc(R.msg !== undefined ? R.msg : (q.e || "")) + '</p><button class="btn" id="go">Continue</button>';
    document.getElementById("go").onclick = done;
    return;
  }
  if(q.k === "flip"){
    f.innerHTML = R.rev ? '<div class="two"><button class="btn" id="miss" style="background:var(--no);border-color:#a82a2f;color:#fff">Missed it</button><button class="btn" id="got">Got it</button></div>' : '<button class="btn" disabled>Reveal first</button>';
    if(R.rev){
      document.getElementById("got").onclick = function(){ R.ok = true; R.msg = ""; finish(); };
      document.getElementById("miss").onclick = function(){ R.ok = false; R.msg = "We’ll bring it back in a moment."; finish(); };
    }
    return;
  }
  if(q.k === "match" || q.k === "sort" || q.k === "story"){
    f.innerHTML = '<button class="btn" disabled>' + (q.k === "story" ? "Make your choices" : q.k === "sort" ? "Sort every card" : "Match all pairs") + '</button>';
    return;
  }
  var ready = q.k === "order" ? R.sel.length === q.o.length : R.sel.length > 0;
  f.innerHTML = '<button class="btn" id="chk"' + (ready ? '' : ' disabled') + '>Check</button>';
  document.getElementById("chk").onclick = function(){
    var ok;
    if(q.k === "order") ok = R.sel.every(function(v, i){ return v === i; });
    else if(q.k === "multi") ok = R.sel.length === q.a.length && q.a.every(function(v){ return R.sel.indexOf(v) > -1; });
    else if(q.k === "year") ok = Math.abs(R.sel[0] - q.a) <= (q.tol || 0);
    else ok = R.sel[0] === q.a;
    R.ok = ok;
    R.msg = undefined;
    finish();
  };
}

function finish(){
  if(R.ok){ R.xp += 10; R.cb = (R.cb || 0) + 1; }
  else { R.hearts--; R.mist++; R.cb = 0; }
  beep(R.ok);
  try { navigator.vibrate && navigator.vibrate(R.ok ? 15 : [40, 30, 40]); } catch(e) {}
  inner(); foot();
}

function done(){
  var k = R.cur.key, i;
  if(R.ok){
    R.solved++;
    if(k && !R.cur.again){
      i = S.weak.indexOf(k);
      if(i > -1) S.weak.splice(i, 1);
    }
  } else {
    if(k && S.weak.indexOf(k) < 0) S.weak.push(k);
    if(!R.cur.again){
      R.queue.push({ q: R.cur.q, again: true, key: k });
    } else {
      R.solved++;
    }
  }
  save(); next();
}

function fin(win){
  if(R.review) return finRev(win);
  var top = DATA[CUR_TOPIC];
  var l = top.lessons[R.i];
  var nq = l.q.length, pct = Math.max(0, Math.round((nq - R.mist)/nq * 100));
  if(win){
    addXp(R.xp);
    S.done[CUR_TOPIC] = S.done[CUR_TOPIC] || {};
    if(!S.done[CUR_TOPIC][R.i] || S.done[CUR_TOPIC][R.i] < pct) S.done[CUR_TOPIC][R.i] = pct;
    save();
  }

  var nextIdx = R.i + 1;
  var hasNext = (nextIdx < top.lessons.length);
  var nextLessonObj = hasNext ? top.lessons[nextIdx] : null;
  var autoTimer = null;

  var h = '<div class="end"><div class="big">' + (win ? '🏆' : '💔') + '</div>' +
    '<h1>' + (win ? 'Lesson complete!' : 'Out of hearts') + '</h1>' +
    '<p class="sub">' + (win ? esc(l.n) + ' cleared.' : 'Re-read the cards and try again.') + '</p>' +
    (win ? '<div class="stats"><div class="stat">+' + R.xp + '<small>XP</small></div><div class="stat">' + pct + '%<small>Accuracy</small></div><div class="stat">' + R.hearts + '<small>Hearts left</small></div></div>' : '<div style="height:24px"></div>');

  if (win && hasNext && nextLessonObj) {
    h += '<div style="background:var(--card);border:2px solid var(--ok);border-radius:14px;padding:12px 16px;margin:10px 0 16px;max-width:340px;width:100%">' +
      '<div style="font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:0.04em">Up Next · Auto-advancing</div>' +
      '<div style="font-size:16px;font-weight:800;color:var(--ink);margin:4px 0 2px">' + esc(nextLessonObj.e) + ' ' + esc(nextLessonObj.n) + '</div>' +
      '<div style="font-size:13px;color:var(--mut)">Starting in <b id="sec-cnt">3</b>s...</div>' +
    '</div>' +
    '<button class="btn" id="btn-next" style="max-width:320px;margin-bottom:8px;background:var(--ok);border-color:#0d7753;color:#fff">Start Next Lesson Now →</button>' +
    '<button class="btn" id="a" style="max-width:320px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink)">Back to Lessons</button>';
  } else if (win) {
    h += '<div style="background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:12px 16px;margin:10px 0 16px;max-width:340px;width:100%">' +
      '<div style="font-size:12px;font-weight:700;color:var(--accd);text-transform:uppercase;letter-spacing:0.04em">👑 All Lessons Cleared!</div>' +
      '<div style="font-size:16px;font-weight:800;color:var(--ink);margin:4px 0 2px">Topic Mastered!</div>' +
    '</div>' +
    '<button class="btn" id="a" style="max-width:320px">Back to Dashboard</button>';
  } else {
    h += '<button class="btn" id="btn-retry" style="max-width:320px;margin-bottom:8px">Try again</button>' +
      '<button class="btn" id="a" style="max-width:320px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink)">Back to Lessons</button>';
  }

  h += '</div>';
  app.innerHTML = h;

  if (win && hasNext && nextLessonObj) {
    var sec = 3;
    autoTimer = setInterval(function(){
      sec--;
      var cnt = document.getElementById('sec-cnt');
      if (cnt) cnt.textContent = sec;
      if (sec <= 0) {
        clearInterval(autoTimer);
        start(nextIdx);
      }
    }, 1000);
    var bn = document.getElementById('btn-next');
    if (bn) bn.onclick = function(){ clearInterval(autoTimer); start(nextIdx); };
  }

  var btnRetry = document.getElementById('btn-retry');
  if (btnRetry) btnRetry.onclick = function(){ start(R.i); };

  document.getElementById("a").onclick = function(){
    if (autoTimer) clearInterval(autoTimer);
    home();
  };

  if(win) confetti();
}

var deferredInstallPrompt = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      console.log('[PWA] Service Worker registered with scope:', reg.scope);
    }).catch(function(err) {
      console.warn('[PWA] Service Worker registration failed:', err);
    });
  });
}

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  var b = document.getElementById('btn-install');
  if (b) b.style.display = 'inline-flex';
});

window.addEventListener('appinstalled', function() {
  deferredInstallPrompt = null;
  var b = document.getElementById('btn-install');
  if (b) b.style.display = 'none';
  confetti();
});

function isStandalone() {
  try {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || (window.navigator && window.navigator.standalone === true);
  } catch(e) {
    return false;
  }
}

function triggerInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(choice) {
      if (choice.outcome === 'accepted') {
        var b = document.getElementById('btn-install');
        if (b) b.style.display = 'none';
      }
      deferredInstallPrompt = null;
    });
  } else {
    showInstallModal();
  }
}

function showInstallModal() {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var old = document.getElementById('install-modal');
  if (old) old.remove();

  var m = document.createElement('div');
  m.id = 'install-modal';
  m.className = 'modal-overlay';
  m.innerHTML = '<div class="modal-sheet">' +
    '<h2>📲 Install on Chrome / Mobile</h2>' +
    '<p>Install this app on your device for 1-tap home screen access, ultra-smooth offline drills, and a clean full-screen learning window.</p>' +
    '<div class="modal-steps">' +
      (isIOS ?
        '<div class="modal-step"><span class="num">1</span><span>Tap the <b>Share button</b> (⎋) at the bottom</span></div>' +
        '<div class="modal-step"><span class="num">2</span><span>Scroll down & tap <b>"Add to Home Screen"</b></span></div>' +
        '<div class="modal-step"><span class="num">3</span><span>Tap <b>Add</b> in the top right</span></div>'
      :
        '<div class="modal-step"><span class="num">1</span><span>Tap the <b>three dots menu (⋮)</b> in Chrome</span></div>' +
        '<div class="modal-step"><span class="num">2</span><span>Tap <b>"Install app"</b> or <b>"Add to Home screen"</b></span></div>' +
        '<div class="modal-step"><span class="num">3</span><span>Confirm <b>Install</b></span></div>'
      ) +
    '</div>' +
    '<button class="btn" id="modal-close">Got it</button>' +
  '</div>';
  document.body.appendChild(m);
  document.getElementById('modal-close').onclick = function() { m.remove(); };
  m.onclick = function(e) { if (e.target === m) m.remove(); };
}

home();
</script></body></html>
