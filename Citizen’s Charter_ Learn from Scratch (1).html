var L=[
{n:"The Big Idea",e:"🧭",d:"What it is, where it began",c:[
{t:"A public promise",b:["A Citizen’s Charter is a written promise by a government body: <b>what services it offers</b>, the <b>standards and timelines</b> it commits to, and <b>how to complain</b> if it fails.","Think of it as a menu with a delivery guarantee, published for citizens."],k:["Service-delivery commitment","Social contract"],n:"It is a statement of intent, not a law."},
{t:"Where it started",b:["The idea began in the <b>UK in 1991</b> under PM John Major. Public services were to treat users like valued customers.","In India it gained momentum after the <b>1997 Conference of Chief Ministers</b>, which adopted an Action Plan for an effective and responsive administration.","The <b>DARPG</b> (Dept. of Administrative Reforms and Public Grievances) is the nodal agency."],k:["New Public Management","DARPG","Citizen-centric governance"]},
{t:"Why it matters",b:["It shifts government from <b>rule-bound</b> to <b>citizen-centric</b>, and turns vague duty into a measurable promise.","Exam angle: GS-2 (governance, transparency, accountability) and GS-4 (responsiveness, public service values)."],k:["Accountability","Responsiveness"]}],
q:[
{k:"tf",q:"A Citizen’s Charter is legally enforceable in a court of law.",a:1,e:"False. It is a voluntary commitment. Enforceability needs a statute, such as a Right to Services Act."},
{k:"mc",q:"In which country did the Citizen’s Charter idea originate (1991)?",o:["United States","United Kingdom","France","Japan"],a:1,e:"UK, under PM John Major."},
{k:"mc",q:"Which body is the nodal agency for Citizen’s Charters in India?",o:["NITI Aayog","Election Commission","DARPG","Finance Commission"],a:2,e:"DARPG in the Ministry of Personnel coordinates charters and grievance redress."},
{k:"mc",q:"Which phrase best captures the philosophy behind charters?",o:["Citizen-centric governance","Maximising revenue","Centralised secrecy","Colonial paternalism"],a:0,e:"Governance designed around the user of the service."}]},
{n:"Anatomy of a Charter",e:"🧩",d:"Principles and contents",c:[
{t:"Six guiding principles",b:["Indian notes list six pillars: <b>Quality, Choice, Standards, Value, Accountability, Transparency</b>.","Quality: better service. Choice: options where possible. Standards: clear, measurable norms. Value: for taxpayers’ money. Accountability: someone answerable. Transparency: open rules."],k:["Quality","Standards","Accountability","Transparency"]},
{t:"What goes inside",b:["<b>Vision and mission</b> of the organisation.","<b>List of services</b> and who is eligible.","<b>Standards and time limits</b> for each service.","<b>Grievance redress</b> process and officer details.","<b>What citizens should do</b> (expectations from the public)."],k:["Service standards","Time limits","Grievance redress"]},
{t:"How to build a good one",b:["<b>Consult</b> citizens and staff, then <b>set realistic standards</b>.","<b>Publish</b> widely, in local languages and online.","<b>Monitor and review</b> regularly, then revise."],k:["Consultation","Periodic review"]}],
q:[
{k:"mc",q:"Which of these is NOT one of the six pillars?",o:["Quality","Standards","Secrecy","Transparency"],a:2,e:"Secrecy is the opposite of the charter spirit."},
{k:"multi",q:"Tap everything a good charter contains.",o:["Service standards and time limits","Grievance redress process","Vision and mission","Officers’ personal salary details"],a:[0,1,2],e:"Salaries are not part of a service promise."},
{k:"order",q:"Put the charter-building steps in order.",o:["Consult citizens and staff","Set realistic standards","Publish widely","Monitor and review"],e:"Consult → Standards → Publish → Review."},
{k:"match",q:"Match the pillar to its meaning.",p:[["Standards","Clear, measurable norms"],["Choice","Options where possible"],["Value","For taxpayers’ money"],["Transparency","Open rules and procedures"]],e:"Use these one-liners to explain pillars in Mains."}]},
{n:"Committees & Models",e:"🏛️",d:"2nd ARC, Sevottam, feedback tools",c:[
{t:"2nd ARC: the big report",b:["The <b>2nd Administrative Reforms Commission</b> studied charters in its 12th Report, <b>“Citizen Centric Administration: The Heart of Governance”</b> (2009).","It stressed that charters must be made in consultation with citizens, carry realistic standards, and be reviewed periodically, or they become paper exercises."],k:["2nd ARC","Citizen Centric Administration"]},
{t:"Sevottam model",b:["<b>Sevottam</b> = Seva (service) + Uttam (excellent). DARPG developed it around 2006 as a quality framework for service delivery.","Three modules: <b>1. Citizen’s Charter</b>, <b>2. Public Grievance Redress</b>, <b>3. Service Delivery Capability</b>.","Organisations are assessed against it, like a report card."],k:["Sevottam","Service Delivery Capability","Self-assessment"]},
{t:"Feedback tools",b:["<b>CPGRAMS</b>: the central online portal to lodge and track grievances.","<b>Citizen Report Cards</b>: surveys where users rate services. Pioneered by the Public Affairs Centre, Bangalore.","Both close the loop between promise and performance."],k:["CPGRAMS","Citizen Report Card"]}],
q:[
{k:"mc",q:"Which 2nd ARC report is the key source on citizen-centric governance?",o:["1st: Right to Information","12th: Citizen Centric Administration","4th: Ethics in Governance only","15th: Local Governance only"],a:1,e:"12th Report: Citizen Centric Administration, The Heart of Governance."},
{k:"multi",q:"Tap the 3 modules of Sevottam.",o:["Citizen’s Charter","Public Grievance Redress","Service Delivery Capability","Revenue Maximisation"],a:[0,1,2],e:"Charter, grievance redress and delivery capability."},
{k:"match",q:"Match tool to purpose.",p:[["Sevottam","Service excellence framework"],["CPGRAMS","Online grievance portal"],["Report Card","Citizen feedback survey"],["2nd ARC 12th Report","Citizen Centric Administration"]],e:"Four keywords you can name-drop confidently."},
{k:"tf",q:"“Sevottam” combines the words Seva and Uttam.",a:0,e:"True: service of the highest quality."}]},
{n:"Legal Backing",e:"⚖️",d:"From promise to guarantee",c:[
{t:"The weakness of a promise",b:["A charter has <b>no penalty</b> and <b>no legal remedy</b>. An officer who ignores it usually faces nothing.","This is why critics call charters ‘paper tigers’."],k:["Non-justiciable","Paper tiger"]},
{t:"The 2011 Bill",b:["The <b>Citizens Charter Bill, 2011</b> (Right of Citizens for Time Bound Delivery of Goods and Services and Redressal of their Grievances) was introduced in Lok Sabha.","It proposed mandatory charters, grievance officers and penalties. It <b>lapsed</b> when the Lok Sabha was dissolved in 2014."],k:["Statutory backing","Lapsed Bill"]},
{t:"Right to Services Acts",b:["States moved first. <b>Madhya Pradesh Lok Sewa Guarantee Act, 2010</b> was the first. Bihar (2011), Rajasthan, Delhi, Karnataka (Sakala) and others followed.","Typical features: <b>notified services, fixed deadlines, penalty on the officer, appeal</b>."],k:["Right to Services","Lok Sewa Guarantee","Sakala"]}],
q:[
{k:"mc",q:"Which state enacted the first Right to Services law (2010)?",o:["Bihar","Madhya Pradesh","Kerala","Gujarat"],a:1,e:"Madhya Pradesh Lok Sewa Guarantee Act, 2010."},
{k:"mc",q:"What does a Right to Services Act add over a plain charter?",o:["More posters","Legal deadlines and penalties","A new logo","Fewer services"],a:1,e:"Statutory deadlines, penalties and appeals make it enforceable."},
{k:"tf",q:"The Citizens Charter Bill, 2011 became an Act in 2012.",a:1,e:"False. It lapsed in 2014."},
{k:"multi",q:"Tap the usual features of a Right to Services Act.",o:["Fixed time limits","Penalty on defaulting officers","First and second appeal","Ban on online services"],a:[0,1,2],e:"Time limits, penalties and appeals."}]},
{n:"Challenges",e:"🚧",d:"Why charters underperform",c:[
{t:"Design problems",b:["Made <b>top-down</b> without consulting users.","Standards are <b>vague</b> (‘as early as possible’) or unrealistic.","Seldom <b>updated</b>, so they go out of date."],k:["Top-down","Vague standards","Ritual compliance"]},
{t:"Awareness and access",b:["Citizens often <b>don’t know</b> a charter exists.","Not in <b>local languages</b>; poor reach for illiterate or digitally excluded people.","Information is displayed but not explained."],k:["Awareness gap","Digital divide"]},
{t:"Enforcement and culture",b:["<b>No penalty</b> for breach, and weak grievance follow-up.","Staff lack <b>training and ownership</b>; the charter is seen as extra paperwork.","Different departments, different formats: no <b>uniform monitoring</b>."],k:["Weak enforcement","Accountability deficit","Bureaucratic culture"]}],
q:[
{k:"mc",q:"“Charters are drafted without consulting citizens.” Which challenge?",o:["Design problem","Awareness problem","Funding problem"],a:0,e:"Top-down design is a design problem."},
{k:"multi",q:"Tap all genuine challenges.",o:["No penalty for breach","Poor awareness among citizens","Too many citizens read charters","Standards are vague or outdated"],a:[0,1,3],e:"Low readership, not high, is the problem."},
{k:"match",q:"Match challenge to root cause.",p:[["Paper tiger","No legal penalty"],["Awareness gap","Not in local language"],["Ritual compliance","Seen as paperwork"],["Vague standards","No SMART timelines"]],e:"Pair cause and effect in your answers."},
{k:"mc",q:"Which is the deepest structural reason charters fail?",o:["Lack of enforceable accountability","Too much colour printing","Too many websites"],a:0,e:"Without consequences, a promise stays a slogan."}]},
{n:"Solutions & Best Practice",e:"✅",d:"What works, here and abroad",c:[
{t:"Fixing the gaps",b:["<b>Co-create</b> with citizens and frontline staff.","Use <b>SMART standards</b> and service level agreements.","Give <b>statutory backing</b> through Right to Services laws.","<b>Third-party audits</b>, social audits and report cards.","<b>Train and reward</b> staff; link to performance appraisal."],k:["SLA","Social audit","Statutory backing"]},
{t:"Technology",b:["Online service portals with <b>tracking and auto-escalation</b> (for example Karnataka’s Sakala).","<b>CPGRAMS</b> for grievances; mobile alerts at each stage.","Digital delivery cuts discretion and delay."],k:["E-governance","Auto-escalation"]},
{t:"Best practices",b:["<b>UK Charter Mark</b>: an award for organisations that excel at service standards.","<b>Madhya Pradesh Lok Sewa Guarantee</b>: statutory time-bound service with penalties.","<b>Citizen Report Cards</b> (Bangalore): evidence-based public feedback."],k:["Charter Mark","Lok Sewa Guarantee","Report Card"]}],
q:[
{k:"multi",q:"Tap the effective solutions.",o:["Co-create charters with citizens","Statutory backing with penalties","Hide the charter from the public","Third-party and social audits"],a:[0,1,3],e:"Transparency and consequences drive results."},
{k:"mc",q:"The UK Charter Mark is best described as:",o:["A tax","An award for excellent service standards","A court","A police force"],a:1,e:"A recognition scheme that rewards good service."},
{k:"match",q:"Match practice to place.",p:[["Charter Mark","United Kingdom"],["Lok Sewa Guarantee","Madhya Pradesh"],["Sakala","Karnataka"],["Report Cards","Bangalore (PAC)"]],e:"One domestic and one global example is enough for Mains."},
{k:"mc",q:"What does ‘SMART standard’ mean in a charter?",o:["Specific, measurable and time-bound","Short, mild, and tentative","Silent and recorded","Subjective and flexible"],a:0,e:"Clear, measurable, time-bound commitments."}]},
{n:"Mains Toolkit",e:"🎯",d:"Keywords, intro, conclusion",c:[

 var h='<div class="top">'+themeBtn+'<button class="x" id="mt" aria-label="Sound">'+(S.mute?'🔇':'🔊')+'</button><span>🔥 '+curStreak()+'</span><span>⚡ '+S.xp+' XP</span></div><div class="home"><h1>Citizen’s Charter</h1><p class="sub">Learn it from zero: read the idea, then prove it. Seven short lessons.</p>'+goalCard()+'<div class="path">';
 L.forEach(function(l,i){var d=S.done[i];h+='<button class="lesson'+(d?' done':'')+'" data-i="'+i+'"><span class="badge">'+(d?'✓':l.e)+'</span><span><b>'+l.n+'</b><small>'+l.d+(d?' · best '+d+'%':'')+'</small></span></button>'});
 app.innerHTML=h+'</div></div>';
 app.querySelectorAll(".lesson").forEach(function(b){b.onclick=function(){start(+b.dataset.i)}});
 var v=document.getElementById("vt"),w=document.getElementById("wk");if(v)v.onclick=vault;if(w)w.onclick=startReview;var pq=document.getElementById("pq");if(pq)pq.onclick=startPyq;var sk=document.getElementById("sk");if(sk)sk.onclick=skPick;var ac=document.getElementById("ac");if(ac)ac.onclick=hub;
 var tb=document.getElementById("theme-btn");if(tb)tb.onclick=function(){var cur=document.documentElement?document.documentElement.getAttribute("data-theme"):null,sysDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches,next=(cur==="dark"||(!cur&&sysDark))?"light":"dark";if(document.documentElement)document.documentElement.setAttribute("data-theme",next);S.theme=next;save();home()};
 document.getElementById("mt").onclick=function(){S.mute=!S.mute;save();home()};
}
function start(i){var l=L[i];R={i:i,ci:0,queue:l.q.map(function(q,n){return {q:q,key:i+':'+n}}),total:l.c.length+l.q.length,solved:0,hearts:5,mist:0,xp:0};next()}
function next(){
 if(R.ci<L[R.i].c.length)return card();
 if(R.hearts<=0)return fin(false);
 if(!R.queue.length)return fin(true);
 R.cur=R.queue.shift();clearInterval(IV);R.sel=[];R.ok=null;R.q=R.cur.q;
 var q=R.q;
 if(q.o)R.ord=sh(q.o.map(function(_,i){return i}));
 if(q.k==="tf")R.ord=[0,1];
 if(q.k==="match"){R.L=sh(q.p.map(function(_,i){return i}));R.Rr=sh(q.p.map(function(_,i){return i}));R.m=[];R.pick=null;R.err=false}
 if(q.k==="flip")R.rev=false;if(q.k==="flag")R.ord=q.o.map(function(_,i){return i});if(q.k==="sort"){R.si=0;R.err=false;R.it=sh(q.it)}if(q.k==="story"){R.so=0;R.pk=null;R.err=false}if(q.k==="riddle")R.cl=1;
 draw();
}
function head(){return '<div class="qhead"><button class="x" id="quit" aria-label="Quit lesson">✕</button><div class="bar"><i style="width:'+Math.round(R.solved/R.total*100)+'%"></i></div>'+(R.pyq||R.duel?'':'<span class="hearts">❤ '+R.hearts+'</span>')+'</div>'}
function quit(){document.getElementById("quit").onclick=function(){if(confirm("Quit this lesson? Progress will be lost."))home()}}
var HUE=["#0f8a62","#2f63d6","#7442d6","#b8760a","#d23a40","#0b8a9a","#d9570c"];
var ICO=[["📜","🌍","🎯"],["🧱","📋","🛠️"],["🏛️","⭐","📊"],["🐯","📃","⚖️"],["📐","📢","🔒"],["🔧","📱","🏆"],["🗝️","🗺️","🧭"]];
function card(){R.sh=1;cardDraw()}
function cardDraw(){
 var c=L[R.i].c[R.ci],n=c.b.length,all=R.sh>=n,tot=L[R.i].c.length;
 var h=head()+'<div class="body" style="--h:'+HUE[R.i%HUE.length]+'"><div class="hero"><span class="ico">'+ICO[R.i][R.ci]+'</span><div><small>'+esc(L[R.i].n)+' · card '+(R.ci+1)+' of '+tot+'</small><h2>'+esc(c.t)+'</h2></div></div>';
 for(var i=0;i<R.sh;i++)h+='<div class="tile'+(i===R.sh-1&&i>0?' pop':'')+'"><span class="dot">✦</span><p>'+c.b[i]+'</p></div>';
 if(all){unlock(c);h+=diag(R.i,R.ci);h+='<p class="kw">🔑 Keywords unlocked</p><div class="chips">';c.k.forEach(function(k){h+='<span class="chip">'+esc(k)+'</span>'});h+='</div>';if(c.n)h+='<div class="bub"><span>🦉</span><p>'+esc(c.n)+'</p></div>'}
 h+='</div><div class="foot"><button class="btn" id="go">'+(all?'Got it':'Continue ('+R.sh+'/'+n+')')+'</button></div>';
 app.innerHTML=h;quit();
 document.getElementById("go").onclick=function(){
  if(!all){R.sh++;cardDraw();var b=document.querySelector(".body");b.scrollTop=b.scrollHeight}
  else{R.solved++;R.ci++;next()}
 };
}
var KIND={riddle:"Detective: who am I?",story:"Officer mission",flag:"Spot the red flag",year:"Slide to the year",sort:"Sort the cards",tf:"True or false",mc:"Pick one",multi:"Select all that apply",order:"Put in order",match:"Match the pairs",flip:"Flip the card"};
function draw(){
 var q=R.q;
 app.innerHTML=head()+'<div class="body"><p class="kind">'+KIND[q.k]+'</p><p class="q">'+esc(q.q)+'</p><div id="in"></div></div><div class="foot" id="foot"></div>';
 quit();inner();foot();if(R.lt)ltTimer();if(R.duel)document.querySelector('.kind').textContent='👥 Player '+(R.pl+1)+'’s turn · '+R.sc[0]+' – '+R.sc[1];
}
function inner(){
 var q=R.q,el=document.getElementById("in"),h="";
 if(q.k==="mc"||q.k==="riddle"||q.k==="flag"||q.k==="tf"||q.k==="multi"){
  var lab=q.k==="tf"?["True","False"]:q.o;if(q.k==="riddle"){h='<div class="fact">';for(var c=0;c<R.cl;c++)h+='<p>🔎 '+esc(q.c[c])+'</p>';h+='</div>';if(R.cl<q.c.length&&R.ok===null)h+='<button class="mb" id="nc" style="width:100%;margin-bottom:12px">💡 Next clue (−3 XP)</button>'}
  R.ord.forEach(function(i){h+='<button class="opt'+(q.k==="flag"?' fl':'')+(R.sel.indexOf(i)>-1?' sel':'')+'" data-i="'+i+'"'+(R.ok!==null?' disabled':'')+'>'+esc(lab[i])+'</button>'});
  el.innerHTML=h;
  var nc=document.getElementById("nc");if(nc)nc.onclick=function(){R.cl++;R.xp=Math.max(0,R.xp-3);inner()};
  el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){var i=+b.dataset.i;
   if(q.k==="multi"){var p=R.sel.indexOf(i);p>-1?R.sel.splice(p,1):R.sel.push(i)}else R.sel=[i];
   inner();foot();if(R.lt&&q.k!=="multi"){clearInterval(IV);R.ok=R.sel[0]===q.a;R.msg=undefined;finish()}}});
 }else if(q.k==="order"){
  h='<div class="slots'+(q.inl?' w':'')+'">'+(R.sel.length?'':'<span class="ph">Tap the items below in order</span>');
  R.sel.forEach(function(i){h+='<button class="opt'+(q.inl?' fl':'')+'" data-r="'+i+'"'+(R.ok!==null?' disabled':'')+'>'+esc(q.o[i])+'</button>'});
  h+='</div>';
  R.ord.forEach(function(i){if(R.sel.indexOf(i)<0)h+='<button class="opt'+(q.inl?' fl':'')+'" data-a="'+i+'"'+(R.ok!==null?' disabled':'')+'>'+esc(q.o[i])+'</button>'});
  el.innerHTML=h;
  el.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){R.sel.push(+b.dataset.a);inner();foot()}});
  el.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){R.sel.splice(R.sel.indexOf(+b.dataset.r),1);inner();foot()}});
 }else if(q.k==="match"){
  h='<div class="cols"><div>';
  R.L.forEach(function(i){h+='<button class="opt'+(R.pick===i?' sel':'')+(R.m.indexOf(i)>-1?' gone':'')+'" data-l="'+i+'">'+esc(q.p[i][0])+'</button>'});
  h+='</div><div>';
  R.Rr.forEach(function(i){h+='<button class="opt'+(R.m.indexOf(i)>-1?' gone':'')+'" data-r="'+i+'">'+esc(q.p[i][1])+'</button>'});
  el.innerHTML=h+'</div></div>';
  el.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){R.pick=+b.dataset.l;inner()}});
  el.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
   if(R.pick===null)return;
   if(R.pick===+b.dataset.r){R.m.push(R.pick);R.pick=null;if(R.m.length===q.p.length){R.ok=!R.err;finish();return}inner()}
   else{R.err=true;R.pick=null;inner();var bb=el.querySelector('[data-r="'+b.dataset.r+'"]');if(bb)bb.classList.add("bad")}}});
 }else if(q.k==="year"){
  var yv=R.sel.length?R.sel[0]:Math.round((q.min+q.max)/2);
  el.innerHTML='<div class="skn" id="yv">'+(R.sel.length?yv:'?')+'</div><input type="range" id="yr" min="'+q.min+'" max="'+q.max+'" value="'+yv+'" style="width:100%" aria-label="Year"'+(R.ok!==null?' disabled':'')+'>';
  var yr=document.getElementById('yr');yr.onchange=yr.oninput=function(){R.sel=[+yr.value];document.getElementById('yv').textContent=yr.value;foot()};
 }else if(q.k==="sort"){
  var it=R.it[R.si];
  if(!it){el.innerHTML='<p class="sub" style="text-align:center">All sorted!</p>';return}
  h='<p class="ph" style="text-align:center">'+(R.si+1)+' of '+R.it.length+'</p><div class="flip" style="text-align:center;font-weight:800;font-size:22px;display:grid;place-items:center;cursor:default">'+esc(it[0])+'</div><div class="cols" style="margin-top:16px">';
  q.b.forEach(function(b,j){h+='<button class="opt" style="text-align:center;font-weight:800" data-b="'+j+'">'+esc(b)+'</button>'});
  el.innerHTML=h+'</div>';
  el.querySelectorAll('[data-b]').forEach(function(b){b.onclick=function(){if(+b.dataset.b===it[1]){R.si++;if(R.si>=R.it.length){R.ok=!R.err;finish();return}inner()}else{R.err=true;b.classList.add('bad')}}});
 }else if(q.k==="story"){
  var sc=q.s[R.so];
  if(!sc){el.innerHTML='<p class="sub" style="text-align:center">Mission complete!</p>';return}
  h='<div class="fact"><p>'+esc(sc.t)+'</p></div>';
  if(R.pk===null){sc.o.forEach(function(o,j){h+='<button class="opt" data-s="'+j+'">'+esc(o[0])+'</button>'})}
  else{var oo=sc.o[R.pk];h+='<div class="tile" style="border-left-color:var(--'+(oo[1]?'ok':'no')+')"><span class="dot">'+(oo[1]?'✅':'⚠️')+'</span><p>'+esc(oo[2])+'</p></div><button class="btn" id="sn">'+(R.so+1>=q.s.length?'Finish mission':'Next scene')+'</button>'}
  el.innerHTML=h;
  el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){R.pk=+b.dataset.s;if(!sc.o[R.pk][1])R.err=true;inner()}});
  var sn=document.getElementById('sn');if(sn)sn.onclick=function(){R.pk=null;R.so++;if(R.so>=q.s.length){R.ok=!R.err;finish()}else inner()};
 }else if(q.k==="flip"){
  el.innerHTML='<div class="flip" id="fl">'+(R.rev?esc(q.r):'<em>Think of your answer, then tap to reveal.</em>')+'</div>'+(R.pyq&&!R.rev?'<p class="tmr" id="tm"></p>':'');
  document.getElementById("fl").onclick=function(){clearInterval(IV);R.rev=true;inner();foot()};
  if(R.pyq&&!R.rev)pyTimer();
 }
}
function foot(){
 var f=document.getElementById("foot"),q=R.q;f.className="foot";
 if(R.ok!==null){
  f.className="foot "+(R.ok?"ok":"no");
  f.innerHTML='<h3>🦉 '+owlSay()+'</h3><p>'+esc(R.msg!==undefined?R.msg:(q.e||""))+'</p><button class="btn" id="go">Continue</button>';
  document.getElementById("go").onclick=done;return;
 }
 if(q.k==="flip"){
  f.innerHTML=R.rev?'<div class="two"><button class="btn" id="miss" style="background:var(--no);border-color:#a82a2f;color:#fff">Missed it</button><button class="btn" id="got">Got it</button></div>':'<button class="btn" disabled>Reveal first</button>';
  if(R.rev){document.getElementById("got").onclick=function(){R.ok=true;R.msg="";finish()};document.getElementById("miss").onclick=function(){R.ok=false;R.msg="We’ll bring it back in a moment.";finish()}}
  return;
 }
 if(q.k==="match"||q.k==="sort"||q.k==="story"){f.innerHTML='<button class="btn" disabled>'+(q.k==="story"?"Make your choices":q.k==="sort"?"Sort every card":"Match all pairs")+'</button>';return}
 var ready=q.k==="order"?R.sel.length===q.o.length:R.sel.length>0;
 f.innerHTML='<button class="btn" id="chk"'+(ready?'':' disabled')+'>Check</button>';
 document.getElementById("chk").onclick=function(){
  var ok;
  if(q.k==="order")ok=R.sel.every(function(v,i){return v===i});
  else if(q.k==="multi")ok=R.sel.length===q.a.length&&q.a.every(function(v){return R.sel.indexOf(v)>-1});
  else if(q.k==="year")ok=Math.abs(R.sel[0]-q.a)<=(q.tol||0);else ok=R.sel[0]===q.a;
  R.ok=ok;R.msg=undefined;finish();
 };
}
function finish(){
 if(R.duel)R.sc[R.pl]+=R.ok?1:0;
 if(R.ok){R.xp+=10;R.cb=(R.cb||0)+1}else{R.hearts--;R.mist++;R.cb=0}
 beep(R.ok);try{navigator.vibrate&&navigator.vibrate(R.ok?15:[40,30,40])}catch(e){}
 inner();foot();
}
function done(){
 if(R.duel)R.pl=1-R.pl;
 var k=R.cur.key,i;
 if(R.ok){R.solved++;if(k&&!R.cur.again){i=S.weak.indexOf(k);if(i>-1)S.weak.splice(i,1)}}
 else{if(k&&S.weak.indexOf(k)<0)S.weak.push(k);if(!R.cur.again){R.queue.push({q:R.cur.q,again:true,key:k})}else{R.solved++}}
 save();next();
}
function fin(win){
 if(R.review)return finRev(win);
 var nq=L[R.i].q.length,pct=Math.max(0,Math.round((nq-R.mist)/nq*100));
 if(win){addXp(R.xp);if(!S.done[R.i]||S.done[R.i]<pct)S.done[R.i]=pct;save()}
 app.innerHTML='<div class="end"><div class="big">'+(win?'🏆':'💔')+'</div><h1>'+(win?'Lesson complete!':'Out of hearts')+'</h1><p class="sub">'+(win?L[R.i].n+' cleared.':'Re-read the cards and try again.')+'</p>'+
 (win?'<div class="stats"><div class="stat">+'+R.xp+'<small>XP</small></div><div class="stat">'+pct+'%<small>Accuracy</small></div><div class="stat">'+R.hearts+'<small>Hearts left</small></div></div>':'<div style="height:24px"></div>')+
 '<button class="btn" id="a">'+(win?'Back to lessons':'Try again')+'</button></div>';
 document.getElementById("a").onclick=function(){win?home():start(R.i)};
 if(win)confetti();
}
home();
</script></body></html>
